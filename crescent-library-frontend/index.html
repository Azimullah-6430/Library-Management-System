            `<span class="bdg ${b.status || "Available"}">${esc(b.status || "Available")}</span>`,
          ],
          ["Condition", esc(b.cond || b.condition)],
          [
            "Vendor / Invoice",
            esc((b.vendor || "") + " " + (b.invoice || b.invoice_no || "")),
          ],
          ["Recorded", (b.createdAt || b.date || "").slice(0, 10)],
        ])}
        <div class="card">
          <h2>Cover Images</h2>
          <div class="row" style="align-items:flex-start">
            ${im(b.frontCover || b.front, "Front Cover")}
            ${im(b.backCover || b.back, "Back Cover")}
          </div>
        </div>
      </div>
    `,
            `
      <a class="btn p" href="#/books/${bookId}/edit">Edit Book</a>
      <a class="btn" href="#/books">Back to Inventory</a>
      <button class="btn" onclick="print()">Print Details</button>
      <button class="btn d" onclick="delBook('${bookId}','${esc(b.title)}',true)">Delete Book</button>
    `,
          );
        } catch (err) {
          return shell(
            "Book Not Found",
            "",
            `<div class="card">No book matches this ID in MongoDB. <a class="btn" href="#/books">Back to Inventory</a></div>`,
          );
        }
      };

      // ── Categories ──────────────────────────────────────────────────────────────
      R.categories = async () => {
        let cats = [];
        try {
          const res = await api("/categories");
          cats = Array.isArray(res) ? res : res.data || [];
          S.cats = cats;
        } catch (err) {
          return shell(
            "Categories",
            "",
            `<div class="card" style="color:var(--er)">Error loading categories: ${esc(err.message)}</div>`,
          );
        }

        return shell(
          "Categories",
          `${cats.length} cataloged subject divisions`,
          `
    <div class="card">
      <div class="tw">
        <table style="min-width:520px">
          <thead>
            <tr>
              <th>Name</th>
              <th>Books</th>
              <th>Description</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${
              cats.length
                ? cats
                    .map(
                      (c) => `
              <tr>
                <td><b>${esc(c.name)}</b></td>
                <td><span class="bdg Available">${c.book_count ?? c.bookCount ?? 0}</span></td>
                <td>${esc(c.desc || c.description || "—")}</td>
                <td class="row">
                  <button class="btn" onclick="catDlg('${c.id || c._id}','${esc(c.name)}','${esc(c.desc || c.description || "")}')">Edit</button>
                  <button class="btn d" onclick="delCat('${c.id || c._id}','${esc(c.name)}')">Delete</button>
                </td>
              </tr>
            `,
                    )
                    .join("")
                : '<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--mu)">No categories found. Click "Add Category" to create one.</td></tr>'
            }
          </tbody>
        </table>
      </div>
    </div>
  `,
          `<button class="btn p" onclick="catDlg()">Add Category</button>`,
        );
      };

      function catDlg(id = "", currName = "", currDesc = "") {
        const d = document.createElement("dialog");
        d.setAttribute("aria-label", id ? "Edit category" : "Add category");
        d.innerHTML = `
    <h2 style="margin-bottom:12px">${id ? "Edit" : "Add"} Category</h2>
    <div class="fld">
      <label for="cn">Category Name *</label>
      <input id="cn" value="${esc(currName)}">
      <div class="err" id="cne"></div>
    </div>
    <div class="fld">
      <label for="cd">Description</label>
      <input id="cd" value="${esc(currDesc)}">
    </div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" id="cx">Cancel</button>
      <button class="btn p" id="cs">Save</button>
    </div>
  `;
        document.body.append(d);
        d.showModal();
        d.onclose = () => d.remove();
        d.querySelector("#cx").onclick = () => d.close();
        d.querySelector("#cs").onclick = async () => {
          const n = d.querySelector("#cn").value.trim();
          const ds = d.querySelector("#cd").value.trim();
          const e = d.querySelector("#cne");
          if (!n) return (e.textContent = "Name is required.");

          try {
            if (id) {
              await api(`/categories/${id}`, {
                method: "PATCH",
                body: { name: n, desc: ds },
              });
              toast("Category updated.");
            } else {
              await api("/categories", {
                method: "POST",
                body: { name: n, desc: ds },
              });
              toast("Category created.");
            }
            d.close();
            R2();
          } catch (err) {
            e.textContent = err.message || "Operation failed";
          }
        };
      }

      function delCat(id, name) {
        ask(
          `Delete category "${name}"? Books in this category will become unassigned.`,
          "Delete",
          async () => {
            try {
              await api(`/categories/${id}`, { method: "DELETE" });
              toast(`Category "${name}" deleted.`);
              R2();
            } catch (err) {
              toast(`Error deleting category: ${err.message}`, 1);
            }
          },
        );
      }

      // ── Reports & Analytics ─────────────────────────────────────────────────────
      R.reports = async () => {
        let rep = {
          summary: {},
          byCategory: [],
          byStatus: [],
          byYear: [],
          byShelf: [],
        };
        try {
          const res = await api("/reports/full");
          rep = res.data || res;
        } catch (err) {
          return shell(
            "Reports & Analytics",
            "",
            `<div class="card" style="color:var(--er)">Failed to load reports: ${esc(err.message)}</div>`,
          );
        }

        const s = rep.summary || {};
        return shell(
          "Reports & Analytics",
          "Live metrics aggregated directly from MongoDB",
          `
    <div class="kpi">
      <div class="card"><span>Cataloged Titles</span><b>${s.totalBooks ?? s.total_books ?? 0}</b></div>
      <div class="card"><span>Total Physical Copies</span><b>${s.totalCopies ?? s.total_copies ?? 0}</b></div>
      <div class="card"><span>Subject Categories</span><b>${s.totalCategories ?? s.total_categories ?? 0}</b></div>
      <div class="card"><span>Total Catalog Value</span><b>${fmt(s.totalValue ?? s.total_inventory_value ?? 0)}</b></div>
    </div>
    <div class="two">
      <div class="card"><h2>Category Distribution</h2>${bars(rep.byCategory || rep.by_category)}</div>
      <div class="card"><h2>Availability Status</h2>${bars(rep.byStatus || rep.by_status)}</div>
      <div class="card"><h2>Publication Year Breakdown</h2>${bars(rep.byYear || rep.by_year)}</div>
      <div class="card"><h2>Shelf / Stock Distribution</h2>${bars(rep.byShelf || rep.by_shelf)}</div>
    </div>
  `,
          `<button class="btn p" onclick="print()">Print Report</button>`,
        );
      };

      // ── Import / Export ─────────────────────────────────────────────────────────
      let ieTab = "import";
      R["import-export"] = () =>
        shell(
          "Import / Export",
          "Permanent database import and export",
          `
  <div class="tabs" role="tablist">
    <button class="${ieTab === "import" ? "on" : ""}" onclick="ieTab='import';R2()">Bulk CSV Import</button>
    <button class="${ieTab === "export" ? "on" : ""}" onclick="ieTab='export';R2()">Export Records</button>
  </div>
  ${
    ieTab === "import"
      ? `
    <div class="card">
      <label for="csv_file">Upload CSV File</label>
      <input id="csv_file" type="file" accept=".csv" onchange="previewImport(this.files[0])">
      <p style="margin-top:12px">
        <button class="btn" onclick="exportData('template')">Download Standard CSV Template</button>
      </p>
    </div>
    <div id="pvw" style="margin-top:14px"></div>
  `
      : `
    <div class="card row" style="gap:12px;align-items:center">
      <button class="btn p" onclick="exportData('excel')">📥 Download Current Excel File (.xlsx)</button>
      <button class="btn" onclick="exportData('csv')">Export All Books (CSV)</button>
    </div>
  `
  }
`,
        );

      async function exportData(type) {
        try {
          let endpoint = "/import-export/export";
          let filename = "crescent_library_inventory.csv";
          if (type === "template") {
            endpoint = "/import-export/template";
            filename = "clms_book_import_template.csv";
          } else if (type === "excel") {
            endpoint = "/import-export/excel";
            filename = "crescent_library_inventory.xlsx";
          }

          toast(
            `Preparing ${type === "excel" ? "Excel workbook (.xlsx)" : "CSV"} download…`,
          );
          const res = await api(endpoint);
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.append(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          toast("Download started.");
        } catch (err) {
          toast(`Export error: ${err.message}`, 1);
        }
      }

      let pendingImportFile = null;

      async function previewImport(file) {
        if (!file) return;
        pendingImportFile = file;
        const pvw = $("#pvw");
        if (!pvw) return;
        pvw.innerHTML =
          '<div class="card"><span class="spinner" style="border-top-color:var(--navy)"></span>Analyzing CSV file…</div>';

        const fd = new FormData();
        fd.append("file", file);

        try {
          const res = await api("/import-export/preview", {
            method: "POST",
            body: fd,
          });
          const rows = res.preview || [];
          const errors = res.errors || [];

          pvw.innerHTML = `
      <div class="card">
        <h2>Preview: ${rows.length} records parsed (${errors.length} issues)</h2>
        ${
          errors.length
            ? `<div class="note" style="border-color:var(--er);color:var(--er);background:#ffebee">Issues: ${errors
                .slice(0, 5)
                .map((e) => esc(e))
                .join("; ")}</div>`
            : ""
        }
        <div class="tw">
          <table>
            <thead><tr><th>#</th><th>Title</th><th>Accession</th><th>Author</th><th>Category</th></tr></thead>
            <tbody>
              ${rows
                .map(
                  (r, i) => `
                <tr>
                  <td>${i + 1}</td>
                  <td><b>${esc(r.title)}</b></td>
                  <td>${esc(r.acc || r.acc_no || "Auto")}</td>
                  <td>${esc(r.author || "—")}</td>
                  <td>${esc(r.cat || r.category || "—")}</td>
                </tr>
              `,
                )
                .join("")}
            </tbody>
          </table>
        </div>
        <button class="btn p" style="margin-top:14px" onclick="commitImport()">Commit Import to MongoDB</button>
      </div>
    `;
        } catch (err) {
          pvw.innerHTML = `<div class="card" style="color:var(--er)">Preview failed: ${esc(err.message)}</div>`;
        }
      }

      async function commitImport() {
        if (!pendingImportFile) return;
        const fd = new FormData();
        fd.append("file", pendingImportFile);

        try {
          const res = await api("/import-export/import", {
            method: "POST",
            body: fd,
          });
          toast(`Import complete: ${res.imported} books added to MongoDB!`);
          pendingImportFile = null;
          go("#/books");
        } catch (err) {
          toast(`Import failed: ${err.message}`, 1);
        }
      }

      // ── Profile & Settings ─────────────────────────────────────────────────────
      R.profile = async () => {
        try {
          const res = await api("/auth/me");
          currentUser = res.user || res.data || res;
          localStorage.setItem("clms_user", JSON.stringify(currentUser));
        } catch (e) {}

        const u = currentUser || {};
        return shell(
          "Profile",
          "Logged in librarian profile",
          `
    <div class="two">
      <div class="card" style="max-width:520px">
        <h2 style="margin-bottom:12px">Librarian Account Details</h2>
        <div class="fld"><label>Full Name</label><input id="pf_name" value="${esc(u.name || "")}" disabled></div>
        <div class="fld"><label>Institutional Email</label><input value="${esc(u.email || "")}" disabled></div>
        <div class="fld"><label>Staff ID</label><input value="${esc(u.staffId || "—")}" disabled></div>
        <div class="fld"><label>Department</label><input value="${esc(u.department || "Central Library")}" disabled></div>
        <div class="fld"><label>Role</label><input value="${esc(u.role || "Librarian")}" disabled></div>
      </div>
      <div class="card" style="max-width:520px">
        <h2 style="margin-bottom:12px">Change Password</h2>
        <div class="fld">
          <label for="cp_old">Current Password</label>
          <div class="pw-box">
            <input id="cp_old" type="password" autocomplete="current-password">
            <button type="button" class="pw-toggle" aria-label="Show password" title="Show password" onclick="togglePasswordVisibility(this)">${EYE_OPEN}</button>
          </div>
        </div>
        <div class="fld">
          <label for="cp_new">New Password</label>
          <div class="pw-box">
            <input id="cp_new" type="password" autocomplete="new-password">
            <button type="button" class="pw-toggle" aria-label="Show password" title="Show password" onclick="togglePasswordVisibility(this)">${EYE_OPEN}</button>
          </div>
        </div>
        <div class="err" id="cp_err"></div>
        <button class="btn p" onclick="updatePassword()">Update Password</button>
      </div>
    </div>
  `,
        );
      };

      async function updatePassword() {
        const old_pw = $("#cp_old")?.value || "";
        const new_pw = $("#cp_new")?.value || "";
        const errEl = $("#cp_err");
        if (errEl) errEl.textContent = "";

        if (!old_pw || !new_pw) {
          if (errEl)
            errEl.textContent = "Both current and new password required.";
          return;
        }
        if (new_pw.length < 8) {
          if (errEl)
            errEl.textContent = "New password must be at least 8 characters.";
          return;
        }

        try {
          await api("/auth/change-password", {
            method: "POST",
            body: { old_password: old_pw, new_password: new_pw },
          });
          toast("Password changed successfully.");
          if ($("#cp_old")) $("#cp_old").value = "";
          if ($("#cp_new")) $("#cp_new").value = "";
        } catch (err) {
          if (errEl)
            errEl.textContent = err.message || "Password update failed";
        }
      }

      R.settings = () =>
        shell(
          "Settings",
          "",
          `
  <div class="card" style="max-width:520px">
    <div class="fld">
      <label>Appearance Theme</label>
      <select onchange="document.documentElement.dataset.theme=this.value;localStorage.setItem('clms_theme',this.value)">
        <option value="light">Light Mode</option>
        <option value="dark" ${document.documentElement.dataset.theme === "dark" ? "selected" : ""}>Dark Mode</option>
      </select>
    </div>
    <div class="fld">
      <label>Table Page Size</label>
      <select onchange="F.ps=+this.value;localStorage.setItem('clms_ps',this.value)">
        ${[8, 15, 30, 50].map((n) => `<option ${F.ps === n ? "selected" : ""}>${n} records per page</option>`).join("")}
      </select>
    </div>
    <div class="fld" style="margin-top:16px">
      <label>Connected Express API</label>
      <input value="${esc(API_BASE)}" disabled style="background:var(--bg)">
    </div>
  </div>
`,
        );

      R.help = () =>
        shell(
          "Help & Documentation",
          "Central Library Management System User Guide",
          `
  <div class="grid">
    <div class="card"><h2>Book Acquisition</h2><p style="color:var(--mu)">Open "Add Book", upload front and back cover images, enter the unique accession number, and save directly to permanent MongoDB storage.</p></div>
    <div class="card"><h2>Accession Numbers</h2><p style="color:var(--mu)">Accession numbers (e.g. ACC-0001) are unique serial identifiers assigned sequentially to every physical volume in the collection.</p></div>
    <div class="card"><h2>Real-Time Inventory</h2><p style="color:var(--mu)">All searches, filters, category counts, and financial valuations query MongoDB live via the Express backend without local storage constraints.</p></div>
    <div class="card"><h2>CSV Export & Import</h2><p style="color:var(--mu)">Download CSV exports or upload batch acquisitions using the standard CSV template format at any time.</p></div>
  </div>
`,
        );

      const nf = () =>
        `<div style="text-align:center;padding:90px 5%">${logo().replace('class="wm"', 'class="wm" style="justify-content:center"')}<h1 style="margin-top:20px">Page Not Found</h1><p>The requested page does not exist.</p><a class="btn p" href="#/">Return Home</a></div>`;

      // ── Main Router Dispatcher ──────────────────────────────────────────────────
      const PROT = [
        "dashboard",
        "books",
        "categories",
        "reports",
        "import-export",
        "profile",
        "settings",
        "help",
      ];

      async function checkAuth() {
        const token = localStorage.getItem("clms_token");
        if (!token) {
          auth = false;
          currentUser = null;
          return false;
        }
        try {
          const res = await api("/auth/me");
          currentUser = res.user || res.data || res;
          auth = true;
          return true;
        } catch (e) {
          auth = false;
          currentUser = null;
          localStorage.removeItem("clms_token");
          return false;
        }
      }

      async function R2() {
        if (skip) {
          skip = 0;
          return;
        }
        const hh = location.hash || "#/";
        if (dirty && cur && hh !== cur) {
          if (!confirm("Discard unsaved form changes?")) {
            skip = 1;
            location.hash = cur;
            return;
          }
          dirty = 0;
        }
        cur = hh;

        const h = hh.replace(/^#\/?/, "").split("?")[0];
        const p = h.split("/");

        // Check authentication session
        if (!currentUser && localStorage.getItem("clms_token")) {
          await checkAuth();
        } else if (!localStorage.getItem("clms_token")) {
          auth = false;
        }

        if (!h && !auth) return go("#/login");
        if (auth && (p[0] === "login" || p[0] === "register")) return go("#/");
        if (PROT.includes(p[0]) && !auth) {
          toast("Please sign in to access the library system.", 1);
          return go("#/login");
        }

        $("#root").innerHTML =
          '<div style="text-align:center;padding:120px 20px;color:var(--mu)"><span class="spinner" style="border-top-color:var(--navy);width:26px;height:26px"></span><p style="margin-top:12px;font-size:14px">Loading CLMS…</p></div>';

        let html = "",
          after = () => {};

        try {
          if (!h) {
            html = await R[""]();
          } else if (p[0] === "login") {
            html = R.login();
            after = () => bindAuth(0);
          } else if (p[0] === "register") {
            html = R.register();
            after = () => bindAuth(1);
          } else if (p[0] === "books" && p[1] === "add") {
            html = await R["books/add"]();
            after = () => bindForm();
          } else if (p[0] === "books" && p[2] === "edit") {
            html = await R.edit(p[1]);
            after = () => bindForm(p[1]);
          } else if (p[0] === "books" && p[1] && !p[2]) {
            html = await R.detail(p[1]);
          } else if (p.length === 1 && R[p[0]]) {
            html = await R[p[0]]();
            if (p[0] === "books") after = tbl;
          } else {
            html = nf();
          }
        } catch (err) {
          console.error("Route Render Error:", err);
          html = `<div class="ctr"><div class="card"><h1>Error Loading Page</h1><p style="color:var(--er)">${esc(err.message)}</p><a class="btn p" href="#/">Return Home</a></div></div>`;
        }

        $("#root").innerHTML = html;
        after();
        scrollTo(0, 0);
      }

      // Restore saved preferences
      const savedTheme = localStorage.getItem("clms_theme");
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
      const savedPs = localStorage.getItem("clms_ps");
      if (savedPs) F.ps = +savedPs;

      addEventListener("beforeunload", (e) => {
        if (dirty) {
          e.preventDefault();
          e.returnValue = "";
        }
      });
      addEventListener("hashchange", () => R2());

      // Initialize application
      R2();
    </script>
  </body>
</html>
