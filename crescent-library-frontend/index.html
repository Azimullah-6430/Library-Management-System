        <div style="display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
          <button id="btn_start_cam" class="btn p" onclick="startLiveQrCamera()">📷 Start Camera Scanner</button>
          <button id="btn_stop_cam" class="btn d" style="display:none" onclick="stopLiveQrCamera()">⏹️ Stop Camera</button>
          <button id="btn_switch_cam" class="btn" style="display:none" onclick="switchCameraFacing()">🔄 Switch Camera</button>
          <select id="scanner_camera_select" style="display:none;font-size:12px;max-width:200px" onchange="onCameraDeviceChanged()"></select>
        </div>

        <div id="scanner_alert_box" style="display:none;max-width:540px;margin:0 auto 14px;padding:10px 14px;border-radius:8px;background:rgba(239,68,68,0.08);border:1px solid var(--er);color:#991b1b;font-size:13px;text-align:left"></div>

        <!-- Camera Viewport Container -->
        <div id="qr_camera_viewport" style="display:none;width:100%;max-width:440px;margin:0 auto 16px;border-radius:12px;overflow:hidden;border:2.5px solid var(--navy);box-shadow:0 4px 14px rgba(0,0,0,0.1)"></div>

        <!-- Manual Accession / Opaque Token Fallback -->
        <div style="border-top:1px solid var(--bd);padding-top:16px;margin-top:12px;text-align:left">
          <label for="scan_input" style="font-size:12.5px;font-weight:600;display:block;margin-bottom:6px">Manual Accession ID or QR Token Fallback:</label>
          <div style="display:flex;gap:8px">
            <input id="scan_input" placeholder="e.g. ACC-1001-C01 or CLMS-QID-50B1CF7A4CBB7541A4060C78" value="${esc(paramQid)}" style="font-family:monospace;font-size:13px;flex:1">
            <button class="btn p" id="btn_do_scan" onclick="executeScanLookup()">Resolve Volume</button>
          </div>
          <small style="color:var(--mu);display:block;margin-top:4px">Tip: You can search by physical copy ID (<code>ACC-1001-C01</code>), shelf barcode, or raw cryptographic QR token.</small>
        </div>
      </div>

      <div id="scan_result"></div>
    </div>
          `,
          `
      <a class="btn" href="#/find">🔍 Find a Book</a>
      <a class="btn" href="#/smartshelf/locations">🏢 Locations</a>
      <a class="btn" href="#/smartshelf/movements">📜 Movement Log</a>
          `
        );
      };

      async function bindScan(paramQid) {
        const inp = $("#scan_input");
        if (inp) {
          inp.onkeydown = (e) => {
            if (e.key === "Enter") executeScanLookup();
          };
          if (paramQid) executeScanLookup(paramQid);
        }
      }

      window.startLiveQrCamera = async () => {
        const vp = $("#qr_camera_viewport");
        const alertBox = $("#scanner_alert_box");
        const btnStart = $("#btn_start_cam");
        const btnStop = $("#btn_stop_cam");
        const btnSwitch = $("#btn_switch_cam");
        const camSel = $("#scanner_camera_select");

        if (!vp) return;
        if (alertBox) {
          alertBox.style.display = "none";
          alertBox.textContent = "";
        }

        if (typeof Html5Qrcode === "undefined") {
          if (alertBox) {
            alertBox.style.display = "block";
            alertBox.innerHTML = `⚠️ <b>QR Scanner Library Loading:</b> Camera scanning component is loading from CDN. Please check connection or use the manual search fallback below.`;
          }
          return;
        }

        vp.style.display = "block";
        if (btnStart) btnStart.style.display = "none";
        if (btnStop) btnStop.style.display = "inline-flex";
        if (btnSwitch) btnSwitch.style.display = "inline-flex";

        try {
          if (!html5QrScanner) {
            html5QrScanner = new Html5Qrcode("qr_camera_viewport");
          }

          try {
            const devices = await Html5Qrcode.getCameras();
            if (devices && devices.length && camSel && camSel.options.length <= 1) {
              camSel.innerHTML = "";
              devices.forEach((d, idx) => {
                const opt = document.createElement("option");
                opt.value = d.id;
                opt.textContent = d.label || `Camera ${idx + 1}`;
                camSel.appendChild(opt);
              });
              camSel.style.display = devices.length > 1 ? "inline-block" : "none";
            }
          } catch (_) {}

          const selectedDeviceId = camSel && camSel.value ? camSel.value : null;
          const cameraConfig = selectedDeviceId
            ? { deviceId: { exact: selectedDeviceId } }
            : { facingMode: currentCameraFacing };

          const qrBoxSize = Math.min(260, Math.floor(vp.clientWidth * 0.75) || 240);

          await html5QrScanner.start(
            cameraConfig,
            {
              fps: 12,
              qrbox: { width: qrBoxSize, height: qrBoxSize },
              aspectRatio: 1.0,
            },
            (decodedText) => {
              onQrCodeSuccessfullyScanned(decodedText);
            },
            () => {}
          );
          isCameraScanning = true;
        } catch (err) {
          console.error("Camera Scanner Error:", err);
          vp.style.display = "none";
          if (btnStart) btnStart.style.display = "inline-flex";
          if (btnStop) btnStop.style.display = "none";
          if (btnSwitch) btnSwitch.style.display = "none";
          isCameraScanning = false;

          let friendlyMsg = `⚠️ <b>Camera Access Error:</b> ${esc(err.message || String(err))}.`;
          if (err.name === "NotAllowedError" || String(err).includes("Permission denied")) {
            friendlyMsg = `⚠️ <b>Camera Permission Denied:</b> Camera access was blocked. Please permit camera access in your browser site permissions or use the manual search below.`;
          } else if (err.name === "NotFoundError" || String(err).includes("DevicesNotFoundError")) {
            friendlyMsg = `⚠️ <b>No Camera Detected:</b> No supported camera device was found. Please use the manual accession search below.`;
          }

          if (alertBox) {
            alertBox.style.display = "block";
            alertBox.innerHTML = friendlyMsg;
          }
        }
      };

      window.stopLiveQrCamera = async () => {
        if (html5QrScanner && isCameraScanning) {
          try {
            await html5QrScanner.stop();
          } catch (_) {}
          isCameraScanning = false;
        }
        const vp = $("#qr_camera_viewport");
        if (vp) vp.style.display = "none";
        const btnStart = $("#btn_start_cam");
        const btnStop = $("#btn_stop_cam");
        const btnSwitch = $("#btn_switch_cam");
        if (btnStart) btnStart.style.display = "inline-flex";
        if (btnStop) btnStop.style.display = "none";
        if (btnSwitch) btnSwitch.style.display = "none";
      };

      window.switchCameraFacing = async () => {
        currentCameraFacing = currentCameraFacing === "environment" ? "user" : "environment";
        await stopLiveQrCamera();
        await startLiveQrCamera();
        toast(`Camera switched to ${currentCameraFacing === 'environment' ? 'rear' : 'front'} lens.`);
      };

      window.onCameraDeviceChanged = async () => {
        if (isCameraScanning) {
          await stopLiveQrCamera();
          await startLiveQrCamera();
        }
      };

      window.onQrCodeSuccessfullyScanned = (decodedText) => {
        if (!decodedText || !decodedText.trim()) return;
        const clean = decodedText.trim();
        const now = Date.now();

        // Avoid duplicate scan submissions caused by repeated video frames (throttle 3.5s)
        if (clean === lastScannedToken && now - lastScannedTimestamp < 3500) {
          return;
        }
        lastScannedToken = clean;
        lastScannedTimestamp = now;

        if (navigator.vibrate) {
          try { navigator.vibrate(80); } catch (_) {}
        }

        const inp = $("#scan_input");
        if (inp) inp.value = clean;

        toast(`📷 Scanned: ${clean.slice(0, 24)}…`);
        executeScanLookup(clean);
      };

      window.executeScanLookup = async (paramText = "") => {
        const inp = $("#scan_input");
        const resEl = $("#scan_result");
        if (!resEl) return;

        const text = (paramText || inp?.value || "").trim();
        if (!text) {
          resEl.innerHTML = `<div class="card" style="color:var(--er);text-align:center">Please scan a physical QR code or enter an accession number.</div>`;
          return;
        }

        resEl.innerHTML = `<div class="card" style="text-align:center;padding:32px;color:var(--mu)"><span class="spinner" style="border-top-color:var(--navy)"></span><p style="margin-top:10px;font-size:14px">Verifying with library backend…</p></div>`;

        try {
          const res = await api("/smartshelf/scan", {
            method: "POST",
            body: { qrText: text }
          });

          if (res.entityType === "COPY" && res.copy) {
            const c = res.copy;
            const b = c.bookId || {};
            const loc = c.locationId || {};
            const isMis = c.isMisplaced;
            const isVerified = c.isAuditVerified;
            const coverSrc = getCoverUrl(b.frontCover);

            resEl.innerHTML = `
              <div class="card" style="border:2px solid ${isMis ? 'var(--er)' : (isVerified ? 'var(--ok)' : 'var(--navy)')};background:var(--sf);box-shadow:0 4px 16px rgba(0,0,0,0.06)">

        const title = $("#fb_title")?.value.trim() || "";

        const acc = $("#fb_acc")?.value.trim() || "";
        const pub = $("#fb_pub")?.value.trim() || "";

        const queryParams = new URLSearchParams();
        if (title) queryParams.set("title", title);
        if (author) queryParams.set("author", author);

        if (acc) queryParams.set("acc", acc);

      function renderLocationsTableHtml() {
        const locations = smartshelfLocationsCache || [];

        const fOcc = smartshelfLocFilter.occupancy;
        const fStatus = smartshelfLocFilter.status;

        const filtered = locations.filter(loc => {
          if (fBuilding && loc.building !== fBuilding) return false;
          if (fFloor && loc.floor !== fFloor) return false;
          if (fOcc === 'occupied' && loc.currentCount === 0) return false;
          if (fOcc === 'empty' && loc.currentCount > 0) return false;
          if (fStatus && loc.status !== fStatus) return false;
          if (q) {
            const hay = `${loc.locationCode} ${loc.building} ${loc.floor} ${loc.section} ${loc.shelf} ${loc.rack} ${loc.row} ${loc.description}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });

        if (!filtered.length) {
          return '<div class="card" style="text-align:center;padding:36px;color:var(--mu)">No library locations match your filter criteria.</div>';

        return `
          <div class="card" style="padding:0;overflow:hidden">

                        <b>${loc.currentCount}</b> / ${loc.capacity} books

                          <div style="background:var(--bd);border-radius:3px;height:6px;width:60px;overflow:hidden">

                      </td>
                      <td>
                        <span class="bdg ${loc.isActive ? 'Available' : 'Lost'}" style="font-size:11px">
                          ${loc.isActive ? 'Active' : 'Inactive'}
                        </span>
                      </td>
                      <td>
                        <div style="display:flex;gap:4px">
                          <a class="btn sm" href="#/smartshelf/locations/${loc._id}">Inspect</a>

            headers: { Authorization: `Bearer ${token}` },

          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `${auditNumber || "AUDIT"}-report.csv`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          toast("✓ Audit report exported as CSV");

            api("/smartshelf/audits").catch(() => ({ audits: [] })),
            api("/smartshelf/locations").catch(() => ({ locations: [] })),
          ]);
          audits = audRes.audits || audRes.data || [];
          locations = locRes.locations || locRes.data || [];
        } catch (_) {}

        // Calculate aggregate metrics
        const totalAudits = audits.length;
        const activeAudits = audits.filter((a) => a.status === "IN_PROGRESS").length;
        const completedAudits = audits.filter((a) => a.status === "COMPLETED").length;
        const totalMisplaced = audits.reduce((acc, a) => acc + (a.summary?.misplacedCount || 0), 0);
        const avgAccuracy =
          completedAudits > 0
            ? Math.round(
                audits
                  .filter((a) => a.status === "COMPLETED")
                  .reduce((acc, a) => acc + (a.summary?.accuracyRate || 0), 0) / completedAudits
              )

        <div style="background:var(--bd);border-radius:4px;height:6px;width:100%;margin-top:8px;overflow:hidden">
          <div style="background:var(--ok);width:${Math.min(100, avgAccuracy)}%;height:100%"></div>
        </div>
      </div>
      <div class="card" style="${totalMisplaced > 0 ? 'border:1.5px solid var(--er);background:rgba(239,68,68,0.04)' : ''}">

    <div class="card" style="margin-bottom:20px">

              <th>Auditor</th>
              <th>Date Started</th>
              <th>Status</th>
              <th>Expected</th>
              <th>Scanned</th>
              <th>Verified</th>

                      const locObj = a.locationId || {};

              </td>
              <td>
                <span class="bdg sm Available" style="font-size:11px">${esc(a.scope?.type || "SHELF")}</span>

              <td>${esc(a.startedBy?.name || "Librarian")}</td>
              <td style="white-space:nowrap;font-size:12px;color:var(--mu)">${dateStr}</td>
              <td>
                ${
                  isInProg
                    ? `<span class="bdg Available" style="background:#fef3c7;color:#92400e;border:1px solid #fde68a;font-weight:700">● IN PROGRESS</span>`
                    : `<span class="bdg Borrowed" style="background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;font-weight:700">✓ COMPLETED</span>`
                }
              </td>
              <td style="font-weight:600">${a.summary?.totalExpected || 0}</td>
              <td>${a.summary?.uniqueScanned || 0}</td>
              <td style="color:var(--ok);font-weight:600">${a.summary?.verifiedCount || 0}</td>
              <td>
                ${
                  (a.summary?.misplacedCount || 0) > 0
                    ? `<span style="color:var(--er);font-weight:700">⚠️ ${a.summary.misplacedCount}</span>`
                    : `<span style="color:var(--mu)">0</span>`

              </td>
              <td>
                ${

                      : `<span style="color:var(--ok)">0</span>`
                }
              </td>
              <td>
                <b style="color:${accColor}">${accRate}%</b>
              </td>
              <td style="text-align:right;white-space:nowrap">
                <div style="display:flex;gap:6px;justify-content:flex-end">
                  <a class="btn ${isInProg ? "p" : "s"} sm" href="#/audits/${a._id}">
                    ${isInProg ? "Resume Audit →" : "View Report"}

                  <button class="btn gh sm" title="Export CSV" onclick="exportAuditReport('${a._id}', '${esc(a.auditNumber)}')">
                    📥 CSV
                  </button>
                </div>
              </td>
            </tr>`;
                    })
                    .join("")
            }
          </tbody>
        </table>
      </div>
    </div>

    <!-- Start Audit Session Modal Dialog -->
    <dialog id="modal-start-audit" style="border:none;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,0.25);padding:0;max-width:560px;width:95%">

          <select id="start_audit_loc_sel" required style="width:100%;font-size:13px;padding:8px" onchange="updateStartAuditPreview()">
            <option value="">-- Select Shelf Location --</option>

          dlg.showModal();
          updateStartAuditPreview();
        }

      window.updateStartAuditPreview = () => {
        const sel = $("#start_audit_loc_sel");
        const countEl = $("#start_audit_expected_count");
        if (!sel || !countEl) return;
        const opt = sel.selectedOptions[0];
        if (!opt || !opt.value) {
          countEl.textContent = "Select a shelf above";
          return;
        }
        const copies = opt.getAttribute("data-copies") || "0";
        countEl.textContent = `${copies} physical copy(ies) recorded on shelf`;
      };

      window.filterAuditsTable = () => {
        const q = ($("#audit_search_inp")?.value || "").toLowerCase().trim();
        document.querySelectorAll("#audits_list_tbl .audit-row").forEach((row) => {
          const text = (row.getAttribute("data-search") || "").toLowerCase();
          row.style.display = !q || text.includes(q) ? "" : "none";
        });
      };

      window.submitStartAudit = async (e) => {
        e.preventDefault();
        const sel = $("#start_audit_loc_sel");
        const btn = $("#btn_submit_start_audit");
        const notes = $("#start_audit_notes")?.value || "";
        const scope = document.querySelector("input[name='audit_scope']:checked")?.value || "SHELF";

        if (!sel || !sel.value) return toast("Please select a shelf location", 1);

        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span>Starting Audit…`;

        try {
          const res = await api("/smartshelf/audits/start", {
            method: "POST",
            body: {
              locationId: sel.value,
              scope,
              notes,
            },
          });

          toast(`✓ Audit session "${res.audit?.auditNumber || "New"}" initialized!`);
          $("#modal-start-audit")?.close();
          go(`#/audits/${res.audit?._id || res.data?._id}`);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = "Begin Audit Session →";
          toast("Failed to start audit: " + err.message, 1);
        }
      };

      function bindAuditsList() {
        filterAuditsTable();
      }

      // ── Active Shelf Audit Session Workspace ─────────────────────────────────────
      let activeAuditScannerInstance = null;

      R["audits/session"] = async (auditId) => {
        let audit = null;
        let scans = [];
        try {
          const res = await api(`/smartshelf/audits/${auditId}`);
          audit = res.audit || res.data;
          scans = res.scans || [];
        } catch (err) {
          return shell(
            "Audit Session Not Found",
            "Error retrieving audit details",
            `<div class="card"><p style="color:var(--er)">${esc(err.message)}</p><a class="btn p" href="#/audits">Return to Audits</a></div>`
          );
        }

        const isInProg = audit.status === "IN_PROGRESS";
        const sum = audit.summary || {};
        const totalExp = sum.totalExpected || 0;

    </div>

    <!-- Exception Resolution Dialog Modal -->
    <dialog id="modal-audit-resolve" style="border:none;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,0.25);padding:0;max-width:520px;width:95%">
      <div style="padding:20px 24px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between">
        <h3 style="margin:0;font-size:17px">Resolve Audit Exception</h3>
        <button type="button" class="btn gh sm" onclick="this.closest('dialog').close()">✕</button>
      </div>
      <form id="form_audit_resolve" style="padding:20px 24px" onsubmit="submitAuditResolve(event)">
        <input type="hidden" id="resolve_audit_id" value="${audit._id}">
        <input type="hidden" id="resolve_copy_id">
        <input type="hidden" id="resolve_item_type">

        <div style="margin-bottom:14px;padding:10px 14px;background:rgba(10,26,48,0.03);border:1px solid var(--bd);border-radius:8px">
          <div style="font-size:12px;color:var(--mu)">Exception Target:</div>
          <strong id="resolve_target_display" style="font-family:monospace;font-size:14px;color:var(--navy)"></strong>
        </div>

        <div style="margin-bottom:16px">
          <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Resolution Action *</label>
          <select id="resolve_action_sel" required style="width:100%;font-size:13px;padding:8px">
            <option value="RELOCATE_TO_SHELF">Relocate volume to this audited shelf (Atomic movement + history log)</option>
            <option value="RETURN_TO_HOME">Confirm returned to original home shelf</option>
            <option value="CONFIRM_MISSING">Confirm volume is Lost / Missing</option>
            <option value="DISMISS">Dismiss exception flag</option>
          </select>
        </div>

        <div style="margin-bottom:20px">
          <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Resolution Notes</label>
          <textarea id="resolve_notes_inp" rows="2" placeholder="e.g. Physically returned to CS Shelf A-1 after inspection" style="width:100%;font-size:13px;resize:vertical"></textarea>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:10px">
          <button type="button" class="btn gh" onclick="this.closest('dialog').close()">Cancel</button>
          <button type="submit" class="btn p" id="btn_submit_resolve">Apply Resolution</button>
        </div>
      </form>
    </dialog>

    <!-- Finalize Audit Confirmation Dialog Modal -->
    <dialog id="modal-audit-finalize" style="border:none;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,0.25);padding:0;max-width:500px;width:95%">
      <div style="padding:20px 24px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between">
        <h3 style="margin:0;font-size:17px;color:var(--navy)">Finalize Shelf Audit Session</h3>
        <button type="button" class="btn gh sm" onclick="this.closest('dialog').close()">✕</button>
      </div>
      <div style="padding:22px 24px">
        <div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:16px">
          <span style="font-size:32px">⚠️</span>
          <div>
            <h4 style="margin:0 0 6px;font-size:15px">Confirm Shelf Audit Completion</h4>
            <p style="margin:0;font-size:13px;color:var(--tx);line-height:1.5">
              Are you sure you have completely scanned this shelf? All <strong id="finalize_missing_count_txt" style="color:var(--er)"></strong> unscanned expected physical volumes will be permanently recorded as <strong>MISSING</strong> in the audit report.
            </p>
          </div>
        </div>

        <div style="padding:10px 14px;background:#fef3c7;border:1px solid #fde68a;border-radius:8px;font-size:12px;color:#92400e;margin-bottom:20px">
          <strong>Notice:</strong> Misplaced books will NOT be automatically relocated. You may review and resolve them explicitly in the Misplaced tab.
        </div>

        <div style="display:flex;justify-content:flex-end;gap:10px">
          <button type="button" class="btn gh" onclick="this.closest('dialog').close()">Continue Scanning</button>
          <button type="button" class="btn p" id="btn_confirm_finalize" onclick="submitFinalizeAudit('${audit._id}')">
            Confirm & Finalize Audit
          </button>
        </div>
      </div>
    </dialog>
          `
        );
      };

      window.switchAuditTab = (tabName) => {
        document.querySelectorAll(".audit-tab-panel").forEach((p) => (p.style.display = "none"));
        document.querySelectorAll(".audit-tab-btn").forEach((b) => {
          b.style.background = "transparent";
          b.style.color = "inherit";
        });
        const activePanel = $(`#audit_tab_${tabName}`);
        const activeBtn = $(`#tab_btn_${tabName}`);
        if (activePanel) activePanel.style.display = "block";
        if (activeBtn) {
          activeBtn.style.background = "var(--navy)";
          activeBtn.style.color = "#fff";
        }
      };

      window.openResolveModal = (auditId, copyIdentifier, itemType, extra) => {
        const dlg = $("#modal-audit-resolve");
        if (!dlg) return;
        $("#resolve_audit_id").value = auditId;
        $("#resolve_copy_id").value = copyIdentifier;
        $("#resolve_item_type").value = itemType;
        $("#resolve_target_display").textContent = `${copyIdentifier} (${itemType})${extra ? " — Home: " + extra : ""}`;
        $("#resolve_notes_inp").value = "";
        dlg.showModal();
      };

      window.submitAuditResolve = async (e) => {
        e.preventDefault();
        const auditId = $("#resolve_audit_id").value;
        const copyIdentifier = $("#resolve_copy_id").value;
        const itemType = $("#resolve_item_type").value;
        const action = $("#resolve_action_sel").value;
        const notes = $("#resolve_notes_inp").value;
        const btn = $("#btn_submit_resolve");

        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span>Resolving…`;

        try {
          await api(`/smartshelf/audits/${auditId}/resolve`, {
            method: "POST",
            body: { copyIdentifier, itemType, action, notes },
          });
          toast(`✓ Exception for "${copyIdentifier}" resolved successfully!`);
          $("#modal-audit-resolve")?.close();
          R2();
        } catch (err) {
          btn.disabled = false;
          btn.textContent = "Apply Resolution";
          toast("Resolution error: " + err.message, 1);
        }
      };

      window.openFinalizeAuditConfirm = (auditId, missingCount) => {
        const dlg = $("#modal-audit-finalize");
        const countTxt = $("#finalize_missing_count_txt");
        if (countTxt) countTxt.textContent = Math.max(0, missingCount);
        if (dlg) dlg.showModal();
      };

      window.submitFinalizeAudit = async (auditId) => {
        const btn = $("#btn_confirm_finalize");
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span>Finalizing Audit…`;

        try {
          const res = await api(`/smartshelf/audits/${auditId}/complete`, {
            method: "POST",
          });
          toast(`✓ Audit finalized! Identified ${res.audit?.summary?.missingCount || 0} missing copy(ies).`);
          $("#modal-audit-finalize")?.close();
          R2();
        } catch (err) {
          btn.disabled = false;
          btn.textContent = "Confirm & Finalize Audit";
          toast("Finalization error: " + err.message, 1);
        }
      };

      window.toggleAuditCamera = async () => {
        const wrapper = $("#audit_cam_viewport_wrapper");
        const btn = $("#btn_toggle_audit_cam");
        if (!wrapper || !btn) return;

        if (activeAuditScannerInstance) {
          try {
            await activeAuditScannerInstance.stop();
            activeAuditScannerInstance.clear();
          } catch (_) {}
          activeAuditScannerInstance = null;
          wrapper.style.display = "none";
          btn.textContent = "📷 Start Camera";
          return;
        }

        if (typeof Html5Qrcode === "undefined") {
          return toast("QR camera scanning library is still initializing. Please try again.", 1);
        }

        wrapper.style.display = "block";
        btn.textContent = "⏹ Stop Camera";

        try {
          activeAuditScannerInstance = new Html5Qrcode("audit_qr_reader");
          let lastScannedText = "";
          let scanCooldown = false;

          await activeAuditScannerInstance.start(
            { facingMode: "environment" },
            {
              fps: 10,
              qrbox: { width: 250, height: 250 },
            },
            (decodedText) => {
              if (scanCooldown || decodedText === lastScannedText) return;
              lastScannedText = decodedText;
              scanCooldown = true;
              setTimeout(() => {
                scanCooldown = false;
                lastScannedText = "";
              }, 2000);

              executeAuditScan(decodedText);
            },
            () => {}
          );
        } catch (camErr) {
          wrapper.style.display = "none";
          btn.textContent = "📷 Start Camera";
          toast("Camera access denied or unavailable: " + camErr.message, 1);
        }
      };

      window.executeAuditScan = async (manualToken) => {
        const inp = $("#audit_scan_inp");
        const token = (manualToken || inp?.value || "").trim();
        const alertBox = $("#audit_last_scan_alert");
        if (!token) return toast("Please enter or scan a book QR code or copy ID", 1);

        const currentAuditId = location.hash.replace(/^#\/?/, "").split("/")[1];
        if (!currentAuditId) return;

        if (inp) inp.value = "";

        try {
          const res = await api(`/smartshelf/audits/${currentAuditId}/scan`, {
            method: "POST",
            body: { qrText: token, copyIdentifier: token },
          });

          if (alertBox) {
            alertBox.style.display = "block";
            const vr = res.verificationResult;
            if (vr === "VERIFIED" || vr === "MATCHED") {
              alertBox.style.background = "#ecfdf5";
              alertBox.style.border = "1.5px solid #a7f3d0";
              alertBox.style.color = "#065f46";
              alertBox.innerHTML = `<strong>✓ VERIFIED:</strong> "${esc(res.copy?.title || token)}" is verified on this shelf!`;
            } else if (vr === "MISPLACED") {
              alertBox.style.background = "#fff7ed";
              alertBox.style.border = "1.5px solid #fed7aa";
              alertBox.style.color = "#c2410c";
              alertBox.innerHTML = `<strong>⚠️ MISPLACED:</strong> "${esc(res.copy?.title || token)}" belongs on shelf <strong>${esc(res.copy?.homeLocationCode || "another shelf")}</strong>!`;
            } else if (vr === "DUPLICATE") {
              alertBox.style.background = "#eff6ff";
              alertBox.style.border = "1.5px solid #bfdbfe";
              alertBox.style.color = "#1d4ed8";
              alertBox.innerHTML = `<strong>ℹ️ DUPLICATE SCAN:</strong> "${esc(res.copy?.title || token)}" has already been scanned in this audit session.`;
            } else {
              alertBox.style.background = "#fef2f2";
              alertBox.style.border = "1.5px solid #fecaca";
              alertBox.style.color = "#b91c1c";
              alertBox.innerHTML = `<strong>❌ UNKNOWN QR:</strong> Token "${esc(token)}" does not belong to any catalog record.`;
            }
          }

          toast(res.message || "Scan recorded");
          // Refresh session view after 500ms
          setTimeout(() => R2(), 500);
        } catch (err) {
          toast("Scan failed: " + err.message, 1);
        }
      };

      function bindAuditSession(auditId) {
        const inp = $("#audit_scan_inp");
        if (inp) {
          inp.onkeydown = (e) => {
            if (e.key === "Enter") executeAuditScan();
          };
          inp.focus();
        }
      }

      const nf = () =>
        `<div style="text-align:center;padding:90px 5%">${logo().replace('class="wm"', 'class="wm" style="justify-content:center"')}<h1 style="margin-top:20px">Page Not Found</h1><p>The requested page does not exist.</p><a class="btn p" href="#/">Return Home</a></div>`;

      // ── Main Router Dispatcher ──────────────────────────────────────────────────
      const PROT = [
        "dashboard",
        "books",
        "smartshelf",
        "scan",
        "find",
        "audits",
        "categories",
        "reports",
        "import-export",
        "profile",
        "settings",
        "help",
      ];

      async function checkAuth() {
        const token = localStorage.getItem("clms_token");
        if (!token) {
          auth = false;
          currentUser = null;
          return false;
        }
        try {
          const res = await api("/auth/me");
          currentUser = res.user || res.data || res;
          auth = true;
          return true;
        } catch (e) {
          if (e.status === 401) {
            auth = false;
            currentUser = null;
            localStorage.removeItem("clms_token");
            return false;
          }
          // If offline / network error, preserve cached user so offline UX stays consistent
          const cached = localStorage.getItem("clms_user");
          if (cached) {
            try {
              currentUser = JSON.parse(cached);
              auth = true;
              return true;
            } catch (_) {}
          }
          return false;
        }
      }

      async function R2() {
        if (skip) {
          skip = 0;
          return;
        }
        const hh = location.hash || "#/";
        if (dirty && cur && hh !== cur) {
          if (!confirm("Discard unsaved form changes?")) {
            skip = 1;
            location.hash = cur;
            return;
          }
          dirty = 0;
        }
        cur = hh;

        const h = hh.replace(/^#\/?/, "").split("?")[0];
        const p = h.split("/");

        // Check authentication session
        if (!currentUser && localStorage.getItem("clms_token")) {
          await checkAuth();
        } else if (!localStorage.getItem("clms_token")) {
          auth = false;
        }

        if (!h && !auth) return go("#/login");
        if (auth && (p[0] === "login" || p[0] === "register")) return go("#/");
        if (PROT.includes(p[0]) && !auth) {
          toast("Please sign in to access the library system.", 1);
          return go("#/login");
        }

        $("#root").innerHTML =
          '<div style="text-align:center;padding:120px 20px;color:var(--mu)"><span class="spinner" style="border-top-color:var(--navy);width:26px;height:26px"></span><p style="margin-top:12px;font-size:14px">Loading CLMS…</p></div>';

        let html = "",
          after = () => {};

        try {
          if (!h) {
            html = await R[""]();
          } else if (p[0] === "login") {
            html = R.login();
            after = () => bindAuth(0);
          } else if (p[0] === "register") {
            html = R.register();
            after = () => bindAuth(1);
          } else if (p[0] === "books" && p[1] === "add") {
            html = await R["books/add"]();
            after = () => bindForm();
          } else if (p[0] === "books" && p[2] === "edit") {
            html = await R.edit(p[1]);
            after = () => bindForm(p[1]);
          } else if (p[0] === "books" && p[1] && !p[2]) {
            html = await R.detail(p[1]);
          } else if (p[0] === "scan") {
            html = await R.scan(p[1] || "");
            after = () => bindScan(p[1] || "");
          } else if (p[0] === "find" || p[0] === "discover") {
            const isStudent = p[0] === "discover";
            html = await R.find(isStudent);
            after = () => bindFind(isStudent);
          } else if (p[0] === "smartshelf") {
            if (!p[1]) {
              html = await R.smartshelf();
              after = () => bindSmartShelfOverview();
            } else if (p[1] === "scan") {
              html = await R.scan(p[2] || "");
              after = () => bindScan(p[2] || "");
            } else if (p[1] === "find") {
              html = await R.find(false);
              after = () => bindFind(false);
            } else if (p[1] === "locations" && !p[2]) {
              html = await R["smartshelf/locations"]();
              after = () => bindSmartShelfLocations();
            } else if (p[1] === "locations" && p[2]) {
              html = await R["smartshelf/location"](p[2]);
              after = () => bindSmartShelfLocation(p[2]);
            } else if (p[1] === "copies" && !p[2]) {
              html = await R["smartshelf/copies"]();
              after = () => bindSmartShelfCopies();
            } else if (p[1] === "copies" && p[2]) {
              html = await R["smartshelf/copy"](p[2]);
              after = () => bindSmartShelfCopy(p[2]);
            } else if (p[1] === "audits" && !p[2]) {
              html = await R.audits();
              after = () => bindAuditsList();
            } else if (p[1] === "audits" && p[2]) {
              html = await R["audits/session"](p[2]);
              after = () => bindAuditSession(p[2]);
            } else if (p[1] === "movements") {
              html = await R["smartshelf/movements"]();
              after = () => bindSmartShelfMovements();
            } else {
              html = nf();
            }
          } else if (p[0] === "audits") {
            if (!p[1]) {
              html = await R.audits();
              after = () => bindAuditsList();
            } else {
              html = await R["audits/session"](p[1]);
              after = () => bindAuditSession(p[1]);
            }
          } else if (p.length === 1 && R[p[0]]) {
            html = await R[p[0]]();
            if (p[0] === "books") after = tbl;
          } else {
            html = nf();
          }
        } catch (err) {
          console.error("Route Render Error:", err);
          html = `<div class="ctr"><div class="card"><h1>Error Loading Page</h1><p style="color:var(--er)">${esc(err.message)}</p><a class="btn p" href="#/">Return Home</a></div></div>`;
        }

        $("#root").innerHTML = html;
        after();
        scrollTo(0, 0);
      }

      // Restore saved preferences
      const savedTheme = localStorage.getItem("clms_theme");
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
      const savedPs = localStorage.getItem("clms_ps");
      if (savedPs) F.ps = +savedPs;

      addEventListener("beforeunload", (e) => {
        if (dirty) {
          e.preventDefault();
          e.returnValue = "";
        }
      });
      addEventListener("hashchange", () => R2());

      // Initialize application
      R2();
    </script>
  </body>
</html>
