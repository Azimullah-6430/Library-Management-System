<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600&display=swap"
    />
    <title>Crescent Library Management System</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
      :root {
        --navy: #102744;
        --mid: #183a5b;
        --bg: #f7f8fa;
        --sf: #fff;
        --gold: #c8a96b;
        --tx: #172334;
        --mu: #5b6b7e;
        --bd: #e1e5ec;
        --ok: #1b7a4b;
        --wn: #a15c00;
        --er: #b3261e;
        --sh: 0 1px 3px rgba(16, 39, 68, 0.08);
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0c1624;
          --sf: #14233a;
          --tx: #e8edf4;
          --mu: #9aabbf;
          --bd: #26384f;
          --navy: #0a1a30;
          --ok: #4cc38a;
          --wn: #e8a94a;
          --er: #ff8a80;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0c1624;
        --sf: #14233a;
        --tx: #e8edf4;
        --mu: #9aabbf;
        --bd: #26384f;
        --navy: #0a1a30;
        --ok: #4cc38a;
        --wn: #e8a94a;
        --er: #ff8a80;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font:
          14px/1.5 Inter,
          Manrope,
          system-ui,
          sans-serif;
        overflow-x: hidden;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      h1,
      h2,
      h3 {
        margin: 0;
        color: var(--tx);
      }
      h1 {
        font-size: 22px;
      }
      h2 {
        font-size: 16px;
      }
      .wm {
        font-weight: 700;
        letter-spacing: 0.04em;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .wm i {
        width: 30px;
        height: 30px;
        border: 1.5px dashed var(--gold);
        border-radius: 6px;
        display: inline-block;
      }
      .wm small {
        display: block;
        font-weight: 500;
        font-size: 10px;
        color: var(--mu);
        letter-spacing: 0.08em;
      }
      .btn {
        display: inline-block;
        border: 1px solid var(--bd);
        background: var(--sf);
        color: var(--tx);
        padding: 8px 14px;
        border-radius: 8px;
        font: 600 13px inherit;
        cursor: pointer;
      }
      .btn.p {
        background: var(--navy);
        color: #fff;
        border-color: var(--navy);
      }
      .btn.g {
        background: var(--gold);
        border-color: var(--gold);
        color: #102744;
      }
      .btn.d {
        color: var(--er);
      }
      .btn:hover {
        filter: brightness(0.96);
      }
      .card {
        background: var(--sf);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 18px;
        box-shadow: var(--sh);
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid var(--bd);
        border-radius: 8px;
        background: var(--sf);
        color: var(--tx);
        font: inherit;
      }
      input:focus,
      select:focus,
      textarea:focus,
      .btn:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 1px;
      }
      label {
        font-weight: 600;
        font-size: 12px;
        display: block;
        margin-bottom: 4px;
      }
      .err {
        color: var(--er);
        font-size: 12px;
        min-height: 16px;
      }
      .fld {
        margin-bottom: 8px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 5%;
        background: var(--sf);
        border-bottom: 1px solid var(--bd);
        flex-wrap: wrap;
        gap: 10px;
      }
      .top nav {
        display: flex;
        gap: 18px;
        color: var(--mu);
        font-weight: 500;
        flex-wrap: wrap;
      }
      .hero {
        background: var(--navy);
        color: #fff;
        padding: 64px 5%;
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 40px;
        align-items: center;
      }
      .hero h1 {
        color: #fff;
        font-size: 38px;
        line-height: 1.15;
        max-width: 560px;
      }
      .hero p {
        color: #c5d0de;
        max-width: 520px;
      }

      .sec {
        padding: 48px 5%;
        max-width: 1200px;
        margin: auto;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
      }
      .step b {
        color: var(--gold);
        font-size: 22px;
      }
      footer {
        background: var(--navy);
        color: #c5d0de;
        padding: 28px 5%;
        font-size: 12px;
      }
      .auth {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 100vh;
      }
      .auth aside {
        background: var(--navy);
        color: #fff;
        padding: 48px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      .auth main {
        padding: 48px 6%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        max-width: 520px;
      }
      .app {
        display: grid;
        grid-template-columns: 230px 1fr;
        min-height: 100vh;
      }
      .side {
        background: var(--navy);
        color: #cbd6e4;
        padding: 16px 10px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
      }
      .side .wm {
        color: #fff;
        padding: 6px 8px 18px;
      }
      .side a {
        display: block;
        padding: 9px 12px;
        border-radius: 8px;
      }
      .side a.on,
      .side a:hover {
        background: var(--mid);
        color: #fff;
      }
      .side a.on {
        box-shadow: inset 3px 0 var(--gold);
      }
      .main {
        min-width: 0;
      }
      .bar {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 24px;
        background: var(--sf);
        border-bottom: 1px solid var(--bd);
        flex-wrap: wrap;
      }
      .bar input {
        max-width: 340px;
      }
      .pg {
        padding: 24px;
        max-width: 1240px;
      }
      .ph {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 18px;
        flex-wrap: wrap;
        gap: 10px;
      }
      .ph small {
        color: var(--mu);
      }
      .kpi {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 14px;
        margin-bottom: 16px;
      }
      .kpi b {
        display: block;
        font-size: 26px;
        margin-top: 4px;
      }
      .kpi span {
        color: var(--mu);
        font-size: 12px;
      }
      .two {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 14px;
        margin-bottom: 16px;
      }
      .tw {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 760px;
      }
      th {
        text-align: left;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--mu);
        padding: 9px 8px;
        border-bottom: 1px solid var(--bd);
        cursor: pointer;
        white-space: nowrap;
      }
      td {
        padding: 9px 8px;
        border-bottom: 1px solid var(--bd);
        vertical-align: middle;
      }
      tr:hover td {
        background: rgba(200, 169, 107, 0.08);
      }
      .th {
        width: 34px;
        height: 46px;
        border-radius: 4px;
        background: var(--mid);
        color: var(--gold);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        overflow: hidden;
      }
      .th img,
      .cv img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .bdg {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 10px;
        border-radius: 99px;
        font-size: 11.5px;
        font-weight: 600;
        line-height: 1.2;
        border: 1px solid transparent;
      }
      .bdg::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .Available {
        background: rgba(27, 122, 75, 0.12);
        color: var(--ok);
        border-color: rgba(27, 122, 75, 0.25);
      }
      .Issued {
        background: rgba(161, 92, 0, 0.12);
        color: var(--wn);
        border-color: rgba(161, 92, 0, 0.25);
      }
      .Reserved {
        background: rgba(81, 45, 168, 0.12);
        color: #7c4dff;
        border-color: rgba(81, 45, 168, 0.25);
      }
      .Lost,
      .Damaged,
      .Withdrawn {
        background: rgba(179, 38, 30, 0.12);
        color: var(--er);
        border-color: rgba(179, 38, 30, 0.25);
      }
      .bar2 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
        font-size: 12px;
      }
      .bar2 span:first-child {
        width: 130px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .bar2 i {
        display: block;
        height: 10px;
        background: var(--gold);
        border-radius: 3px;
        min-width: 3px;
      }
      .bar2 div {
        flex: 1;
      }
      .fg {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 4px 14px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .row > * {
        flex: 0 0 auto;
      }
      .dz {
        border: 2px dashed var(--bd);
        border-radius: 10px;
        padding: 14px;
        text-align: center;
        color: var(--mu);
        background: var(--bg);
      }
      .dz.o {
        border-color: var(--gold);
      }
      .cv {
        width: 100%;
        max-width: 200px;
        aspect-ratio: 3/4;
        margin: 8px auto;
        background: var(--bg);
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--mu);
      }
      .note {
        background: rgba(200, 169, 107, 0.15);
        border: 1px solid var(--gold);
        border-radius: 8px;
        padding: 10px;
        font-size: 12px;
        margin-bottom: 12px;
      }
      dl {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 6px;
        margin: 0;
      }
      dt {
        color: var(--mu);
      }
      dd {
        margin: 0;
      }
      .acc {
        background: var(--navy);
        color: var(--gold);
        padding: 3px 10px;
        border-radius: 6px;
        font-weight: 700;
      }
      #toast {
        position: fixed;
        right: 16px;
        bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 9;
      }
      #toast div {
        background: var(--navy);
        color: #fff;
        padding: 10px 14px;
        border-radius: 8px;
        border-left: 4px solid var(--gold);
        box-shadow: var(--sh);
      }
      #toast .e {
        border-color: var(--er);
      }
      @media (max-width: 860px) {
        .hero,
        .auth {
          grid-template-columns: 1fr;
        }
        .auth aside {
          display: none;
        }
        .app {
          grid-template-columns: 1fr;
        }
        .side {
          position: static;
          height: auto;
          display: flex;
          overflow-x: auto;
          gap: 4px;
        }
        .side .wm {
          display: none;
        }
        .side a {
          white-space: nowrap;
        }
        .hero h1 {
          font-size: 28px;
        }
        .pg {
          padding: 14px;
        }
      }
      @media print {
        .side,
        .bar,
        .ph .row,
        .no-print {
          display: none !important;
        }
        .app {
          display: block;
        }
      }
      .two {
        grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr));
      }
      .side {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .side a,
      .side button {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-radius: 8px;
        background: none;
        border: 0;
        color: inherit;
        font: inherit;
        cursor: pointer;
        text-align: left;
      }
      .side .bt {
        margin-top: auto;
        border-top: 1px solid #ffffff22;
        padding-top: 8px;
      }
      .ic {
        width: 18px;
        height: 18px;
        flex: none;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .app.c {
        grid-template-columns: 64px 1fr;
      }
      .app.c .lb,
      .app.c .side .wm div {
        display: none;
      }
      .pw-box {
        position: relative;
        display: flex;
        align-items: center;
      }
      .pw-box input {
        padding-right: 44px;
      }
      .pw-toggle {
        position: absolute;
        right: 4px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 6px 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--mu);
        border-radius: 6px;
        transition:
          color 0.15s ease,
          background 0.15s ease;
      }
      .pw-toggle:hover {
        color: var(--tx);
        background: var(--bg);
      }
      .pw-toggle:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 1px;
      }
      .ctr {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .ctr .card {
        width: 100%;
        max-width: 440px;
        padding: 32px;
        box-shadow:
          0 4px 20px -2px rgba(16, 39, 68, 0.08),
          0 2px 6px rgba(16, 39, 68, 0.04);
        border: 1px solid var(--bd);
        border-radius: 14px;
      }
      dialog {
        border: 1px solid var(--bd);
        border-radius: 12px;
        background: var(--sf);
        color: var(--tx);
        padding: 20px;
        width: min(420px, 92vw);
      }
      dialog::backdrop {
        background: rgba(10, 26, 48, 0.5);
      }
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--bd);
        margin-bottom: 14px;
      }
      .tabs button {
        background: none;
        border: 0;
        padding: 8px 14px;
        font: 600 13px inherit;
        color: var(--mu);
        cursor: pointer;
        border-bottom: 2px solid transparent;
      }
      .tabs button.on {
        color: var(--tx);
        border-color: var(--gold);
      }
      details.ad {
        margin: 6px 0 10px;
      }
      details.ad summary {
        cursor: pointer;
        font-weight: 600;
        padding: 6px 0;
      }
      .am {
        position: relative;
        margin-left: auto;
      }
      .am summary {
        list-style: none;
        cursor: pointer;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--navy);
        color: var(--gold);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }
      .am div {
        position: absolute;
        right: 0;
        top: 40px;
        background: var(--sf);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 6px;
        min-width: 150px;
        z-index: 5;
        box-shadow: var(--sh);
      }
      .am a {
        display: block;
        padding: 7px 10px;
        border-radius: 6px;
      }
      .am a:hover {
        background: var(--bg);
      }
      .spines {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        height: 240px;
      }
      .spines i {
        display: block;
        width: 44px;
        border-radius: 4px 4px 0 0;
        box-shadow: inset -6px 0 0 rgba(0, 0, 0, 0.15);
      }
      .hero {
        padding: 56px 5%;
      }
      .hero h1 {
        font-size: 34px;
      }
      @media (max-width: 860px) {
        .side {
          flex-direction: row;
        }
        .side .bt {
          margin-top: 0;
          border: 0;
          padding: 0;
          display: flex;
        }
        .app.c {
          grid-template-columns: 1fr;
        }
        .tg {
          display: none !important;
        }
        .spines i {
          width: 30px;
        }
      }
      body {
        font-size: 16px;
      }
      h1 {
        font-size: 28px;
      }
      h2 {
        font-size: 18px;
      }
      .btn {
        font:
          600 15px/1.2 Inter,
          Manrope,
          system-ui,
          sans-serif;
        padding: 10px 16px;
      }
      .gb {
        font:
          600 15px/1.2 Inter,
          system-ui,
          sans-serif;
        padding: 11px;
      }
      .tabs button {
        font:
          600 15px/1.2 Inter,
          system-ui,
          sans-serif;
      }
      label {
        font-size: 14px;
      }
      input,
      select,
      textarea {
        font-size: 15.5px;
        padding: 10px 12px;
      }
      td {
        font-size: 15px;
      }
      th {
        font-size: 12.5px;
      }
      .kpi b {
        font-size: 30px;
      }
      .kpi span,
      .ph small,
      small,
      .bar2 {
        font-size: 14px;
      }
      .err {
        font-size: 13.5px;
      }
      .side {
        font-size: 15.5px;
      }
      .side a,
      .side button {
        padding: 11px 12px;
      }
      .app {
        grid-template-columns: 250px 1fr;
      }
      .app.c {
        grid-template-columns: 68px 1fr;
      }
      .pg {
        max-width: 1320px;
      }
      .bdg {
        font-size: 12.5px;
      }
      .note {
        font-size: 14px;
      }
      dl {
        grid-template-columns: 170px 1fr;
      }
      dt {
        font-size: 14px;
      }
      .ctr .card {
        max-width: 440px;
      }
      .ctr h1 {
        font-size: 24px;
      }
      @media (max-width: 860px) {
        .app,
        .app.c {
          grid-template-columns: 1fr;
        }
      }
      .card {
        border-radius: 8px;
        box-shadow: none;
      }
      .btn,
      input,
      select,
      textarea {
        border-radius: 6px;
      }
      h1,
      .hd {
        font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
        font-weight: 600;
      }
      th {
        background: var(--bg);
      }
      .kpi .card {
        border-top: 3px solid var(--gold);
      }
      .btn.gh {
        background: transparent;
        color: #fff;
        border-color: #ffffff66;
      }
      .hh {
        background: var(--navy);
        color: #c9d4e2;
        border-radius: 8px;
        padding: 36px;
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 36px;
        align-items: center;
        border-bottom: 3px solid var(--gold);
      }
      .hh p {
        margin: 0 0 22px;
        max-width: 520px;
        line-height: 1.6;
      }
      .ey {
        font-size: 12.5px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--gold);
        font-weight: 600;
      }
      .hh .hd {
        font-size: 36px;
        line-height: 1.2;
        color: #fff;
        margin: 8px 0 12px;
      }
      .gl {
        margin: 0;
        display: grid;
        border-left: 1px solid #ffffff26;
        padding-left: 32px;
        gap: 16px;
      }
      .gl dt {
        color: #9fb0c6;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .gl dd {
        font:
          600 32px/1.2 "Source Serif 4",
          Georgia,
          serif;
        color: #fff;
        margin: 2px 0 0;
      }
      .gl div {
        display: block;
      }
      .sh {
        font-size: 13px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--mu);
        margin: 28px 0 12px;
        font-weight: 700;
      }
      .qa {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }
      .qi {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 16px;
        background: var(--sf);
        border: 1px solid var(--bd);
        border-radius: 8px;
      }
      .qi:hover {
        border-color: var(--gold);
      }
      .qi b {
        display: block;
      }
      .qi span {
        color: var(--mu);
        font-size: 14px;
      }
      .qi .ic {
        width: 24px;
        height: 24px;
        color: var(--gold);
      }
      .rl {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid var(--bd);
      }
      .rl div {
        flex: 1;
        min-width: 0;
      }
      .rl b,
      .rl span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rl span {
        color: var(--mu);
        font-size: 14px;
      }
      .rl em {
        font-style: normal;
        color: var(--mu);
        font-size: 13px;
      }
      .st {
        margin: 0;
        padding: 0;
        list-style: none;
        counter-reset: s;
      }
      .st li {
        counter-increment: s;
        display: flex;
        flex-direction: column;
        padding: 10px 0 12px 44px;
        position: relative;
        border-bottom: 1px solid var(--bd);
      }
      .st li:before {
        content: counter(s);
        position: absolute;
        left: 0;
        top: 11px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1.5px solid var(--gold);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }
      .st span {
        color: var(--mu);
        font-size: 14px;
      }
      .app.c .side .wm {
        padding: 6px 0 18px;
        justify-content: center;
      }
      .app.c .side {
        padding-left: 6px;
        padding-right: 6px;
      }
      @media (max-width: 860px) {
        .hh {
          grid-template-columns: 1fr;
          padding: 24px;
        }
        .gl {
          border-left: 0;
          padding: 16px 0 0;
          border-top: 1px solid #ffffff26;
        }
        .hh .hd {
          font-size: 28px;
        }
      }
      .spinner {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 0.8s ease-in-out infinite;
        vertical-align: middle;
        margin-right: 6px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="toast" aria-live="polite"></div>
    <script>
      const LOGO = "./assets/logo.png";
      const API_BASE = window.CLMS_API || "http://localhost:5000/api/v1";

      const fmt = (n) =>
        new Intl.NumberFormat("en-IN", {
          style: "currency",
          currency: "INR",
          maximumFractionDigits: 0,
        }).format(n || 0);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const today = () => new Date().toISOString().slice(0, 10);
      const $ = (s) => document.querySelector(s);
      const go = (h) => (location.hash = h);

      // ── Real REST API Client (Node.js + Express + MongoDB backend) ─────────────
      async function api(path, opts = {}) {
        const token = localStorage.getItem("clms_token");
        const headers = { ...(opts.headers || {}) };
        if (token) headers["Authorization"] = `Bearer ${token}`;

        if (
          !(opts.body instanceof FormData) &&
          opts.body &&
          typeof opts.body === "object"
        ) {
          headers["Content-Type"] = "application/json";
          opts.body = JSON.stringify(opts.body);
        }

        const url = path.startsWith("http") ? path : `${API_BASE}${path}`;
        try {
          const res = await fetch(url, { ...opts, headers });
          if (res.status === 401) {
            localStorage.removeItem("clms_token");
            localStorage.removeItem("clms_user");
            auth = false;
            currentUser = null;
            if (
              !location.hash.includes("login") &&
              !location.hash.includes("register")
            ) {
              toast("Session expired or unauthorized. Please sign in.", 1);
              go("#/login");
            }
            throw new Error("Unauthorized");
          }
          const ct = res.headers.get("content-type") || "";
          if (ct.includes("application/json")) {
            const data = await res.json();
            if (!res.ok)
              throw new Error(
                data.message || data.detail || "API request failed",
              );
            return data;
          }
          if (!res.ok) throw new Error(res.statusText || "API request failed");
          return res;
        } catch (err) {
          if (err.message !== "Unauthorized") {
            console.warn("API Error on", path, err.message);
          }
          throw err;
        }
      }

      // ── Application State (Populated strictly from live Backend API) ─────────────
      let auth = false;
      let currentUser = null;
      let S = {
        books: [],
        cats: [],
        total: 0,
        pages: 1,
        summary: {},
        fullReport: {},
      };
      let F = {
        q: "",
        cat: "",
        st: "",
        sort: "createdAt",
        dir: -1,
        pg: 1,
        ps: 8,
      };
      let D = { front: "", back: "", frontFile: null, backFile: null };
      let col = 0,
        dirty = 0,
        cur = "",
        skip = 0;

      function toast(m, e) {
        const t = document.createElement("div");
        t.textContent = m;
        if (e) t.className = "e";
        $("#toast").append(t);
        setTimeout(() => t.remove(), 4000);
      }

      function getCoverUrl(path) {
        if (!path) return "";
        if (
          path.startsWith("http://") ||
          path.startsWith("https://") ||
          path.startsWith("data:")
        )
          return path;
        const base = API_BASE.replace("/api/v1", "");
        return `${base}${path.startsWith("/") ? "" : "/"}${path}`;
      }

      const logo = () =>
        `<div class="wm"><img src="${LOGO}" width="40" height="40" alt="" style="flex:none;border-radius:50%"><div>Crescent Library<small>B.S. Abdur Rahman Crescent Institute</small></div></div>`;
      const IC = {
        home: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .7-1.5l7-6a2 2 0 0 1 2.6 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
        dash: '<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
        books:
          '<path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/>',
        plus: '<circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/>',
        tag: '<path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r=".5"/>',
        chart:
          '<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9M13 17V5M8 17v-3"/>',
        swap: '<path d="m16 3 4 4-4 4M20 7H4M8 21l-4-4 4-4M4 17h16"/>',
        user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
        set: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
        out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
        menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
      };
      const ic = (n) =>
        `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || ""}</svg>`;

      const NAV = [
        ["#/", "Home", "home"],
        ["#/dashboard", "Dashboard", "dash"],
        ["#/books", "All Books", "books"],
        ["#/books/add", "Add Book", "plus"],
        ["#/categories", "Categories", "tag"],
        ["#/reports", "Reports", "chart"],
        ["#/import-export", "Import / Export", "swap"],
      ];

      const shell = (t, sub, body, act = "") => {
        const h = location.hash;
        const lk = (n, x = "") =>
          `<a href="${n[0]}" title="${n[1]}" class="${(h || "#/") === n[0] || (n[0] === "#/books" && /^#\/books\/(?!add)/.test(h)) ? "on" : ""}" ${x}>${ic(n[2])}<span class="lb">${n[1]}</span></a>`;
        const initials =
          currentUser && currentUser.name
            ? currentUser.name
                .split(" ")
                .map((x) => x[0])
                .join("")
                .slice(0, 2)
                .toUpperCase()
            : "CL";

        return `<div class="app${col ? " c" : ""}"><nav class="side" aria-label="Main"><div class="wm" style="padding:6px 8px 18px"><img src="${LOGO}" width="44" height="44" alt="Crescent Library logo" style="flex:none;background:#fff;border-radius:50%;padding:3px"><div>Crescent Library<small>Chennai</small></div></div>${NAV.map((n) => lk(n)).join("")}<div class="bt">${lk(["#/profile", "Profile", "user"])}${lk(["#/settings", "Settings", "set"])}${lk(["#/login", "Logout", "out"], 'onclick="doLogout();return false;"')}</div></nav><div class="main"><div class="bar"><button class="btn tg" aria-label="Toggle sidebar" onclick="col=!col;document.querySelector('.app').classList.toggle('c')">${ic("menu")}</button><small style="color:var(--mu)">Home / ${esc(t)}</small>${h === "#/books" ? "" : `<input id="gs" placeholder="Search books…" aria-label="Search books" value="${esc(F.q)}" onkeydown="if(event.key==='Enter'){F.q=this.value;F.pg=1;go('#/books')}">`}<span class="bdg Available" title="Connected to MongoDB via Express API">MongoDB Atlas</span><details class="am"><summary aria-label="Profile menu">${initials}</summary><div><div style="padding:6px 10px;font-size:12px;color:var(--mu);border-bottom:1px solid var(--bd)">${esc(currentUser ? currentUser.name : "Librarian")}</div><a href="#/profile">Profile</a><a href="#/settings">Settings</a><a href="#/help">Help</a><a href="#/login" onclick="doLogout();return false;">Logout</a></div></details></div><div class="pg">${t === "Home" ? "" : `<div class="ph"><div><h1>${esc(t)}</h1><small>${sub}</small></div><div class="row">${act}</div></div>`}${body}</div></div></div>`;
      };

      const bars = (entries, f = (x) => x) => {
        if (!entries || !entries.length)
          return '<p style="color:var(--mu)">No distribution data yet.</p>';
        const mx = Math.max(1, ...entries.map((x) => x.count || x[1] || 0));
        return entries
          .map((item) => {
            const k =
              item.category ||
              item.status ||
              item.year ||
              item.shelf ||
              item[0] ||
              "Unknown";
            const v =
              item.count !== undefined
                ? item.count
                : item.copies || item[1] || 0;
            return `<div class="bar2"><span>${esc(k)}</span><div><i style="width:${(v / mx) * 100}%"></i></div><b>${f(v)}</b></div>`;
          })
          .join("");
      };

      const th = (b) => {
        const imgUrl = getCoverUrl(b.frontCover || b.front);
        return `<div class="th">${imgUrl ? `<img src="${imgUrl}" alt="">` : esc((b.title || "B")[0])}</div>`;
      };

      // ── Auth Pages & Symbols ───────────────────────────────────────────────────
      const EYE_OPEN = `<svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
      const EYE_OFF = `<svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>`;

      function togglePasswordVisibility(btn) {
        const input = btn.previousElementSibling;
        if (!input) return;
        const isPw = input.type === "password";
        input.type = isPw ? "text" : "password";
        btn.innerHTML = isPw ? EYE_OFF : EYE_OPEN;
        btn.setAttribute(
          "aria-label",
          isPw ? "Hide password" : "Show password",
        );
        btn.title = isPw ? "Hide password" : "Show password";
      }

      function authPage(reg) {
        const fl = (id, l, t = "text", x = "") =>
          `<div class="fld"><label for="${id}">${l}</label>${x || `<input id="${id}" type="${t}">`}<div class="err" id="e_${id}"></div></div>`;
        const pwf = (id, l) =>
          fl(
            id,
            l,
            "",
            `<div class="pw-box"><input id="${id}" type="password" autocomplete="current-password"><button type="button" class="pw-toggle" aria-label="Show password" title="Show password" onclick="togglePasswordVisibility(this)">${EYE_OPEN}</button></div>`,
          );

        return `<div class="ctr"><div class="card"><div style="text-align:center"><img src="${LOGO}" width="76" height="76" alt="Crescent logo" style="border-radius:50%"><div style="font-weight:700;margin-top:10px;line-height:1.35">B.S. Abdur Rahman Crescent Institute of Science and Technology</div><div style="color:var(--mu);font-size:14px">Central Library Management System</div></div><h1 style="text-align:center">${reg ? "Create Librarian Account" : "Librarian Sign In"}</h1><form id="af" novalidate>${reg ? fl("name", "Full Name *") : ""}${fl("email", "Institutional Email *", "email")}${reg ? fl("staffId", "Staff / Faculty ID") : ""}${pwf("pw", "Password *")}${reg ? `<small style="color:var(--mu);display:block;margin:-4px 0 8px">Minimum 8 characters.</small>${pwf("pw2", "Confirm Password *")}` : ""}<button class="btn p" style="width:100%;margin-top:14px" id="sb">${reg ? "Register Account" : "Sign In"}</button></form><div style="text-align:center;margin-top:18px;font-size:13px"><a href="${reg ? "#/login" : "#/register"}" style="color:var(--navy);font-weight:600">${reg ? "Already registered? Sign In" : "New librarian? Register account"}</a></div></div></div>`;
      }

      function bindAuth(reg) {
        $("#af").onsubmit = async (e) => {
          e.preventDefault();
          const v = (id) => ($("#" + id)?.value || "").trim();
          const er = {};

          if (!v("email")) er.email = "Enter your email address.";
          if (!v("pw")) er.pw = "Enter your password.";
          if (reg) {
            if (!v("name")) er.name = "Full name is required.";
            if (v("pw").length < 8)
              er.pw = "Password must be at least 8 characters.";
            if (v("pw") !== v("pw2")) er.pw2 = "Passwords do not match.";
          }

          document
            .querySelectorAll(".err")
            .forEach((x) => (x.textContent = ""));
          Object.entries(er).forEach(([k, m]) => {
            if ($("#e_" + k)) $("#e_" + k).textContent = m;
          });
          if (Object.keys(er).length) return;

          const sb = $("#sb");
          sb.disabled = true;
          sb.innerHTML = `<span class="spinner"></span>Please wait…`;

          try {
            let res;
            if (reg) {
              res = await api("/auth/register", {
                method: "POST",
                body: {
                  name: v("name"),
                  email: v("email"),
                  password: v("pw"),
                  staffId: v("staffId") || undefined,
                  department: "Central Library",
                },
              });
            } else {
              res = await api("/auth/login", {
                method: "POST",
                body: {
                  email: v("email"),
                  password: v("pw"),
                },
              });
            }

            const token = res.token || res.access_token;
            if (!token) throw new Error("Authentication token not received");
            localStorage.setItem("clms_token", token);
            currentUser = res.user;
            localStorage.setItem("clms_user", JSON.stringify(res.user));
            auth = true;

            toast(
              reg
                ? "Account created successfully! Welcome to CLMS."
                : "Signed in successfully.",
            );
            go("#/");
          } catch (err) {
            sb.disabled = false;
            sb.textContent = reg ? "Register Account" : "Sign In";
            toast(
              err.message ||
                "Authentication failed. Please check credentials or verify server is running.",
              1,
            );
          }
        };
      }

      function doLogout() {
        localStorage.removeItem("clms_token");
        localStorage.removeItem("clms_user");
        auth = false;
        currentUser = null;
        toast("Signed out successfully.");
        go("#/login");
      }

      // ── App Route Handlers ──────────────────────────────────────────────────────
      const R = {};

      R[""] = async () => {
        const hr = new Date().getHours();
        const gr =
          hr < 12
            ? "Good morning"
            : hr < 17
              ? "Good afternoon"
              : "Good evening";
        const name = currentUser ? currentUser.name : "Librarian";

        let summary = { totalBooks: 0, totalCopies: 0, totalCategories: 0 };
        let recent = [];
        try {
          const [sData, bData] = await Promise.all([
            api("/reports/summary"),
            api("/books?limit=4&sort=createdAt&dir=-1"),
          ]);
          summary = sData.data || sData;
          recent = bData.items || bData.data || [];
        } catch (e) {
          console.error("Home load error:", e);
        }

        const QA = [
          [
            "Browse Catalog",
            "Search and manage book inventory",
            "#/books",
            "books",
          ],
          [
            "Register a Book",
            "Add cover images and physical metadata",
            "#/books/add",
            "plus",
          ],
          [
            "Reports & Analytics",
            "Totals and stock distributions",
            "#/reports",
            "chart",
          ],
          [
            "Import / Export",
            "Bulk import & export via CSV",
            "#/import-export",
            "swap",
          ],
        ];

        return shell(
          "Home",
          "",
          `
    <section class="hh">
      <div>
        <div class="ey">B.S. Abdur Rahman Crescent Institute of Science and Technology</div>
        <h2 class="hd">${gr}, ${esc(name)}.</h2>
        <p>The Central Library inventory, catalog and live reports are ready.</p>
        <div class="row">
          <a class="btn g" href="#/dashboard">Open Dashboard</a>
          <a class="btn gh" href="#/books/add">Register a Book</a>
        </div>
      </div>
      <dl class="gl">
        <div><dt>Catalog Titles</dt><dd>${summary.totalBooks ?? summary.total_books ?? 0}</dd></div>
        <div><dt>Physical Copies</dt><dd>${summary.totalCopies ?? summary.total_copies ?? 0}</dd></div>
        <div><dt>Categories</dt><dd>${summary.totalCategories ?? summary.total_categories ?? 0}</dd></div>
      </dl>
    </section>
    <h3 class="sh">Quick Access</h3>
    <div class="qa">${QA.map((q) => `<a href="${q[2]}" class="qi">${ic(q[3])}<div><b>${q[0]}</b><span>${q[1]}</span></div></a>`).join("")}</div>
    <div class="two" style="margin-top:8px">
      <div class="card">
        <h3 class="sh" style="margin-top:0">Recently Added</h3>
        ${
          recent.length
            ? recent
                .map(
                  (b) => `
          <a class="rl" href="#/books/${b.id || b._id}">
            ${th(b)}
            <div><b>${esc(b.title)}</b><span>${esc(b.author || "—")} · ${esc(b.acc || b.acc_no || "")}</span></div>
            <em>${(b.createdAt || b.date || "").slice(0, 10)}</em>
          </a>
        `,
                )
                .join("")
            : '<p style="color:var(--mu);padding:10px 0">No books cataloged yet. Click "Register a Book" to start.</p>'
        }
        <a class="btn" style="margin-top:14px" href="#/books">View All Books</a>
      </div>
      <div class="card">
        <h3 class="sh" style="margin-top:0">Cataloging Workflow</h3>
        <ol class="st">
          <li><b>Upload Cover Images</b><span>Front and back covers are stored securely on the server via Multer.</span></li>
          <li><b>Enter Bibliographic Data</b><span>Title, accession serial number, classification, and shelf coordinates.</span></li>
          <li><b>Save to Permanent Storage</b><span>Updates inventory and reports in MongoDB in real time.</span></li>
        </ol>
      </div>
    </div>
  `,
        );
      };

      R.login = () => authPage(0);
      R.register = () => authPage(1);

      R.dashboard = async () => {
        let summary = {
          totalBooks: 0,
          totalCopies: 0,
          totalCategories: 0,
          totalValue: 0,
        };
        let byCategory = [];
        let recent = [];

        try {
          const [fullRep, booksRes] = await Promise.all([
            api("/reports/full"),
            api("/books?limit=5&sort=createdAt&dir=-1"),
          ]);
          const repData = fullRep.data || fullRep;
          summary = repData.summary || {};
          byCategory = repData.byCategory || repData.by_category || [];
          recent = booksRes.items || booksRes.data || [];
        } catch (e) {
          console.error("Dashboard load error:", e);
        }

        const kpis = [
          ["Total Books", summary.totalBooks ?? summary.total_books ?? 0],
          ["Total Copies", summary.totalCopies ?? summary.total_copies ?? 0],
          [
            "Categories",
            summary.totalCategories ?? summary.total_categories ?? 0,
          ],
          [
            "Inventory Value (est.)",
            fmt(summary.totalValue ?? summary.total_inventory_value ?? 0),
          ],
        ];

        return shell(
          "Dashboard",
          "Live inventory overview from MongoDB.",
          `
    <div class="kpi">${kpis.map((k) => `<div class="card"><span>${k[0]}</span><b>${k[1]}</b></div>`).join("")}</div>
    <div class="two">
      <div class="card">
        <h2 style="margin-bottom:8px">Recently Added</h2>
        <div class="tw">
          <table style="min-width:400px">
            <tbody>
              ${
                recent.length
                  ? recent
                      .map(
                        (b) => `
                <tr>
                  <td>${th(b)}</td>
                  <td><a href="#/books/${b.id || b._id}"><b>${esc(b.title)}</b></a><br><small>${esc(b.acc || b.acc_no || "")}</small></td>
                  <td>${(b.createdAt || b.date || "").slice(0, 10)}</td>
                </tr>
              `,
                      )
                      .join("")
                  : '<tr><td colspan="3" style="color:var(--mu);padding:14px">No books in catalog.</td></tr>'
              }
            </tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <h2 style="margin-bottom:8px">Books by Category</h2>
        ${bars(byCategory)}
      </div>

      function pv(k) {
        const el = $("#pv_" + k);

      function updateCoverExtractBadges() {
        const bf = $("#badge_front");
        const bb = $("#badge_back");
        const sf = $("#st_front");
        const sb = $("#st_back");
        const hasFront = !!(D.frontFile || D.front);

      function handleFilePick(k, file) {

          return;

        if (file.size > 5 * 1024 * 1024) {
          if (errEl) errEl.textContent = "File exceeds 5 MB limit.";
          return;

        D[k + "File"] = file;

          dirty = 1;

      let ocrWorker = null;
      async function getOcrWorker() {
        if (ocrWorker) return ocrWorker;
        if (typeof Tesseract === "undefined") {
          throw new Error(
            "OCR library is initializing. Please try again in a moment.",
          );
        }
        ocrWorker = await Tesseract.createWorker("eng");
        return ocrWorker;
      }

      async function triggerAutoExtractManual() {
        const hasFront = !!(D.frontFile || D.front);
        const hasBack = !!(D.backFile || D.back);

        if (!hasFront && !hasBack) {
          return toast(
            "Please upload or capture front and/or back book cover first.",
            1,
          );
        }

        const container = $("#ocr_container");
        const btn = $("#ocr_btn");
        if (btn) btn.disabled = true;

        if (container) {
          container.innerHTML = `
            <div id="ocr_status" class="card" style="margin-bottom:14px;background:rgba(24,58,91,0.06);border:1px dashed var(--gold);padding:14px 18px;border-radius:8px">
              <div style="display:flex;align-items:center;gap:12px">
                <span class="spinner" style="border-top-color:var(--navy);width:22px;height:22px"></span>
                <div>
                  <b style="font-size:14px">✨ Extracting Details from Uploaded Covers…</b>
                  <div style="font-size:12px;color:var(--mu)" id="ocr_p_text">
                    ${hasFront && hasBack ? "Scanning front & back covers for Title, Author, ISBN, Publisher, and details…" : hasFront ? "Scanning front cover for Title and Author…" : "Scanning back cover for ISBN and Publisher…"}
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        try {
          let metadata = {
            title: "",
            author: "",
            isbn: "",
            publisher: "",
            year: "",
            edition: "",
            notes: "",
            category: "",
            price: "",
            format: "",
          };

          // Helper to turn base64 data URL into Blob
          const dataUrlToBlob = (dataUrl) => {
            const arr = dataUrl.split(",");
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) u8arr[n] = bstr.charCodeAt(n);
            return new Blob([u8arr], { type: mime });
          };

          // 1. Primary High-Accuracy Neural Extraction via Backend API
          let backendSuccess = false;
          try {
            const fd = new FormData();
            if (D.frontFile) {
              fd.append("frontCover", D.frontFile);
            } else if (D.front && D.front.startsWith("data:")) {
              fd.append("frontCover", dataUrlToBlob(D.front), "frontCover.jpg");
            }

            if (D.backFile) {
              fd.append("backCover", D.backFile);
            } else if (D.back && D.back.startsWith("data:")) {
              fd.append("backCover", dataUrlToBlob(D.back), "backCover.jpg");
            }

            const pText = $("#ocr_p_text");
            if (pText) pText.textContent = "Scanning covers with high-accuracy neural OCR and resolving book metadata…";

            const apiRes = await api("/books/extract-details", {
              method: "POST",
              body: fd,
            });

            if (apiRes && apiRes.data && (apiRes.data.title || apiRes.data.isbn || apiRes.data.author)) {
              metadata = { ...metadata, ...apiRes.data };
              backendSuccess = true;
            }
          } catch (netErr) {
            console.warn("Backend OCR extraction notice:", netErr);
          }

          // 2. Client-side OCR fallback if offline or backend returned empty
          if (!backendSuccess || (!metadata.title && !metadata.isbn)) {
            if (typeof Tesseract === "undefined") {
              await new Promise((resolve, reject) => {
                const s = document.createElement("script");
                s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
                s.onload = resolve;
                s.onerror = () => reject(new Error("Unable to load OCR engine"));
                document.head.append(s);
              });
            }

            const worker = await getOcrWorker();
            let frontText = "";
            let backText = "";

            if (hasFront) {
              const pText = $("#ocr_p_text");
              if (pText) pText.textContent = "Scanning Front Cover for Title and Author…";
              const frontSource = D.frontFile || D.front;
              const resF = await worker.recognize(frontSource);
              frontText = resF.data.text || "";
            }

            if (hasBack) {
              const pText = $("#ocr_p_text");
              if (pText) pText.textContent = "Scanning Back Cover for ISBN Barcode, Publisher and Details…";
              const backSource = D.backFile || D.back;
              const resB = await worker.recognize(backSource);
              backText = resB.data.text || "";
            }

            const rawCombined = `${frontText}\n${backText}`;

            // ISBN extraction from text
            const isbn13Match = rawCombined.match(/\b(97[89][-\s]?[0-9]{1,5}[-\s]?[0-9]{2,7}[-\s]?[0-9]{1,7}[-\s]?[0-9])\b/);
            if (isbn13Match) {
              metadata.isbn = isbn13Match[1].replace(/[-\s]/g, "");
            }

            // Price extraction and conversion to INR
            const convertCurrencyToInr = (text) => {
              if (!text) return null;
              const rates = { USD: 84.0, EUR: 92.0, GBP: 108.0, CAD: 62.0, AUD: 55.0, INR: 1.0 };
              const inrM = text.match(/(?:₹|Rs\.?|INR)\s*([0-9]+(?:\.[0-9]{2})?)/i) || text.match(/([0-9]+(?:\.[0-9]{2})?)\s*(?:₹|Rs\.?|INR)/i);
              if (inrM) { const v = parseFloat(inrM[1]); if (!isNaN(v)) return { inr: Math.round(v), original: `₹${v}` }; }
              const gbpM = text.match(/(?:£|GBP)\s*([0-9]+(?:\.[0-9]{2})?)/i) || text.match(/([0-9]+(?:\.[0-9]{2})?)\s*(?:£|GBP)/i);
              if (gbpM) { const v = parseFloat(gbpM[1]); if (!isNaN(v)) return { inr: Math.round(v * rates.GBP), original: `£${v} GBP` }; }
              const eurM = text.match(/(?:€|EUR)\s*([0-9]+(?:\.[0-9]{2})?)/i) || text.match(/([0-9]+(?:\.[0-9]{2})?)\s*(?:€|EUR)/i);
              if (eurM) { const v = parseFloat(eurM[1]); if (!isNaN(v)) return { inr: Math.round(v * rates.EUR), original: `€${v} EUR` }; }
              const cadM = text.match(/(?:CAN\s*\$|C\s*\$|CAD)\s*([0-9]+(?:\.[0-9]{2})?)/i) || text.match(/([0-9]+(?:\.[0-9]{2})?)\s*CAD/i);
              if (cadM) { const v = parseFloat(cadM[1]); if (!isNaN(v)) return { inr: Math.round(v * rates.CAD), original: `C$${v} CAD` }; }
              const audM = text.match(/(?:A\s*\$|AUD)\s*([0-9]+(?:\.[0-9]{2})?)/i) || text.match(/([0-9]+(?:\.[0-9]{2})?)\s*AUD/i);
              if (audM) { const v = parseFloat(audM[1]); if (!isNaN(v)) return { inr: Math.round(v * rates.AUD), original: `A$${v} AUD` }; }
              const usdM = text.match(/(?:US\s*)?\$([0-9]+(?:\.[0-9]{2})?)/i) || text.match(/USD\s*([0-9]+(?:\.[0-9]{2})?)/i) || text.match(/([0-9]+(?:\.[0-9]{2})?)\s*(?:USD|US\b)/i);
              if (usdM) { const v = parseFloat(usdM[1]); if (!isNaN(v)) return { inr: Math.round(v * rates.USD), original: `$${v} USD` }; }
              const genM = text.match(/[$€£₹]([0-9]+(?:\.[0-9]{2})?)/);
              if (genM) { const v = parseFloat(genM[1]); if (!isNaN(v)) return { inr: Math.round(v * rates.USD), original: `$${v}` }; }
              return null;
            };

            const conv = convertCurrencyToInr(rawCombined);
            if (conv) {
              metadata.price = conv.inr;
              metadata.originalPrice = conv.original;
            }

            if (/\bhardcover\b/i.test(rawCombined)) metadata.format = "Hardcover";
            else if (/\bpaperback\b/i.test(rawCombined)) metadata.format = "Paperback";

            // If ISBN was found locally, lookup in OpenLibrary
            if (metadata.isbn) {
              try {
                const olRes = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${metadata.isbn}&jscmd=data&format=json`);
                const olJson = await olRes.json();
                const bInfo = olJson[`ISBN:${metadata.isbn}`];
                if (bInfo) {
                  if (bInfo.title) metadata.title = bInfo.title + (bInfo.subtitle ? `: ${bInfo.subtitle}` : "");
                  if (bInfo.authors && bInfo.authors.length) metadata.author = bInfo.authors.map((a) => a.name).join(", ");
                  if (bInfo.publishers && bInfo.publishers.length) metadata.publisher = bInfo.publishers.map((p) => p.name).join(", ");
                  if (bInfo.publish_date) {
                    const ym = bInfo.publish_date.match(/\b(19\d{2}|20[0-2]\d)\b/);
                    if (ym) metadata.year = ym[0];
                  }
                  if (bInfo.subjects && bInfo.subjects.length) metadata.category = bInfo.subjects[0].name || "";
                }
              } catch (e) {}
            }

            // Fallback front title / author lines
            if (!metadata.title) {
              const frontLines = frontText.split(/\r?\n/).map((l) => l.trim()).filter((l) => l.length > 3);
              if (frontLines.length > 0) metadata.title = frontLines[0];
              if (frontLines.length > 1) metadata.author = frontLines[1];
            }
          }


          // 4. Populate ONLY dynamically extracted values into their respective regions
          const populatedList = [];
          const setFieldInRespectiveRegion = (id, val, displayName, customDisplayHtml) => {
            const el = $("#f_" + id);
            const badge = $("#ext_" + id);
            if (el && val !== undefined && val !== null && val !== "") {
              el.value = val;
              el.style.borderColor = "var(--ok)";
              el.style.boxShadow = "0 0 0 3px rgba(27,122,75,0.2)";
              setTimeout(() => {
                el.style.borderColor = "";
                el.style.boxShadow = "";
              }, 4000);
              if (badge) {
                badge.style.display = "inline-block";
                badge.textContent = "✓ Extracted (editable)";
              }
              populatedList.push(`<b>${displayName}:</b> ${customDisplayHtml || esc(val)}`);
            }
          };

          if (metadata.title)
            setFieldInRespectiveRegion("title", metadata.title, "Title");
          if (metadata.author)
            setFieldInRespectiveRegion("author", metadata.author, "Author");
          if (metadata.isbn)
            setFieldInRespectiveRegion("isbn", metadata.isbn, "ISBN");
          if (metadata.publisher)
            setFieldInRespectiveRegion(
              "publisher",
              metadata.publisher,
              "Publisher",
            );
          if (metadata.year)
            setFieldInRespectiveRegion("year", metadata.year, "Year");
          if (metadata.edition)
            setFieldInRespectiveRegion("edition", metadata.edition, "Edition");
          if (metadata.price) {
            const priceDisplay = metadata.originalPrice
              ? `₹${metadata.price} <span style="font-size:11px;color:var(--mu)">(Converted from ${esc(metadata.originalPrice)} to INR)</span>`
              : `₹${metadata.price}`;
            setFieldInRespectiveRegion("price", metadata.price, "Price (INR)", priceDisplay);
          }
          if (metadata.format)
            setFieldInRespectiveRegion("format", metadata.format, "Format");
          if (metadata.notes)
            setFieldInRespectiveRegion(
              "notes",
              metadata.notes,
              "Notes / Description",
            );

          if (metadata.category && S.cats && S.cats.length) {
            const matched = S.cats.find(
              (c) =>
                c.name
                  .toLowerCase()
                  .includes(metadata.category.toLowerCase()) ||
                metadata.category.toLowerCase().includes(c.name.toLowerCase()),
            );
            if (matched) {
              setFieldInRespectiveRegion("cat", matched.name, "Category");
            }
          }

          // NO mock accession or fallback insertion: accession is left for the user/library to assign
          dirty = 1;

          // 5. Render Success Banner confirming details are stored in respective regions
          if (container) {
            container.innerHTML = `
              <div id="ocr_status" class="note" style="background:rgba(27,122,75,0.08);border:1.5px solid var(--ok);color:var(--tx);margin-bottom:14px;padding:14px 18px;border-radius:8px">
                <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
                  <div style="flex:1">
                    <div style="display:flex;align-items:center;gap:8px">
                      <span style="font-size:18px">✨</span>
                      <b style="font-size:14.5px;color:var(--ok)">Details Extracted & Stored in Respective Regions!</b>
                    </div>
                    <div style="margin:8px 0;font-size:13px;display:flex;flex-direction:column;gap:3px">
                      ${populatedList.map((item) => `<div>${item}</div>`).join("")}
                    </div>
                    <div style="font-size:12px;background:rgba(255,255,255,0.85);padding:8px 12px;border-radius:6px;border-left:3px solid var(--ok);margin-top:6px">
                      📝 <b>Manual correction available:</b> Details are now populated in their respective regions below. You can click into any field to manually adjust or correct information before storing.
                    </div>
                  </div>
                  <button type="button" class="btn" style="padding:3px 8px;font-size:11px" onclick="$('#ocr_container').innerHTML=''">✕</button>
                </div>
              </div>
            `;
          }

          toast(
            "Details extracted into respective regions! Manual corrections enabled.",
          );
          const step3 = document.querySelector("#step3_region");
          if (step3)
            step3.scrollIntoView({ behavior: "smooth", block: "start" });
        } catch (err) {
          console.error("OCR Extraction Error:", err);
          if (container) {
            container.innerHTML = `
              <div class="note" style="margin-bottom:14px;border-color:var(--wn);color:var(--wn);display:flex;align-items:center;justify-content:space-between">
                <span>⚠️ Extraction note: ${esc(err.message || "Could not auto-extract details")}. Please enter details manually in respective regions below.</span>
                <button type="button" class="btn" style="padding:2px 8px;font-size:11px" onclick="$('#ocr_container').innerHTML=''">✕</button>
              </div>
            `;
          }
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      function openCameraCapture(slotKey, slotLabel) {
        let stream = null;
        let facingMode = "environment";
        let capturedBlob = null;

        const d = document.createElement("dialog");
        d.setAttribute("aria-label", "Camera Capture: " + slotLabel);
        d.style.cssText =
          "width:min(600px, 94vw);padding:0;overflow:hidden;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx)";

        d.innerHTML = `
          <div style="background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:18px">📷</span>
              <b style="font-size:14px">${esc(slotLabel)} — Direct Camera Capture</b>
            </div>
            <button type="button" class="btn" id="cam_x" style="padding:2px 8px;background:transparent;color:#fff;border-color:rgba(255,255,255,0.3);font-size:16px">✕</button>
          </div>
          <div style="padding:16px">
            <div id="cam_viewport" style="position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:3/4;background:#0a1a30;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center">
              <video id="cam_v" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
              <canvas id="cam_c" style="display:none;width:100%;height:100%;object-fit:cover"></canvas>
              <div id="cam_frame" style="position:absolute;inset:14px;border:2px dashed rgba(200,169,107,0.8);border-radius:6px;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px">
                <span style="background:rgba(0,0,0,0.65);color:#fff;font-size:11px;padding:3px 10px;border-radius:4px;letter-spacing:0.04em">Align book cover inside frame</span>
              </div>
              <div id="cam_spin" style="position:absolute;color:#fff;display:flex;align-items:center;gap:8px;font-size:13px">
                <span class="spinner" style="border-top-color:var(--gold)"></span> Initializing camera…
              </div>
            </div>
            <div class="err" id="cam_err_msg" style="text-align:center;margin-top:10px"></div>
            <div class="row" style="justify-content:center;margin-top:14px;gap:8px" id="cam_live_actions">
              <button type="button" class="btn" id="cam_flip" style="display:none">🔄 Switch Camera</button>
              <button type="button" class="btn p" id="cam_snap" style="padding:9px 18px;font-size:14px">📸 Capture Photo</button>
              <label class="btn" style="cursor:pointer" for="cam_native_fallback">📁 Device Camera / File</label>
              <input type="file" id="cam_native_fallback" accept="image/*" capture="environment" style="display:none">
            </div>
            <div class="row" style="justify-content:center;margin-top:14px;gap:8px;display:none" id="cam_review_actions">
              <button type="button" class="btn" id="cam_retake">↺ Retake Photo</button>
              <button type="button" class="btn p" id="cam_use">✓ Use This Photo</button>
            </div>
          </div>
        `;

        document.body.append(d);
        d.showModal();

        const video = d.querySelector("#cam_v");
        const canvas = d.querySelector("#cam_c");
        const frame = d.querySelector("#cam_frame");
        const spin = d.querySelector("#cam_spin");
        const errMsg = d.querySelector("#cam_err_msg");
        const liveActions = d.querySelector("#cam_live_actions");
        const reviewActions = d.querySelector("#cam_review_actions");
        const flipBtn = d.querySelector("#cam_flip");

        function stopTracks() {
          if (stream) {
            stream.getTracks().forEach((t) => t.stop());
            stream = null;
          }
        }

        async function initCamera(mode) {
          stopTracks();
          spin.style.display = "flex";
          errMsg.textContent = "";
          try {
            if (
              !navigator.mediaDevices ||
              !navigator.mediaDevices.getUserMedia
            ) {
              throw new Error(
                "Direct camera access is not supported by your browser. Please use 'Device Camera / File'.",
              );
            }
            stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: { ideal: mode },
                width: { ideal: 1280 },
                height: { ideal: 960 },
              },
              audio: false,
            });
            video.srcObject = stream;
            await video.play();
            spin.style.display = "none";

            if (navigator.mediaDevices.enumerateDevices) {
              const devices = await navigator.mediaDevices.enumerateDevices();
              const videoDevices = devices.filter(
                (dev) => dev.kind === "videoinput",
              );
              if (videoDevices.length > 1) {
                flipBtn.style.display = "inline-block";
              }
            }
          } catch (err) {
            spin.style.display = "none";
            errMsg.textContent =
              err.name === "NotAllowedError" ||
              err.name === "PermissionDeniedError"
                ? "Camera permission was denied. Please allow camera permissions in your browser or click 'Device Camera / File'."
                : `Camera error: ${err.message || "Unable to access camera"}`;
          }
        }

        initCamera(facingMode);

        flipBtn.onclick = () => {
          facingMode = facingMode === "environment" ? "user" : "environment";
          initCamera(facingMode);
        };

        d.querySelector("#cam_snap").onclick = () => {
          if (!video.videoWidth || !video.videoHeight) {
            errMsg.textContent = "Camera video feed is not ready yet.";
            return;
          }
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          canvas.style.display = "block";
          video.style.display = "none";
          frame.style.display = "none";
          liveActions.style.display = "none";
          reviewActions.style.display = "flex";

          canvas.toBlob(
            (blob) => {
              capturedBlob = blob;
            },
            "image/jpeg",
            0.92,
          );
        };

        d.querySelector("#cam_retake").onclick = () => {
          capturedBlob = null;
          canvas.style.display = "none";
          video.style.display = "block";
          frame.style.display = "flex";
          reviewActions.style.display = "none";
          liveActions.style.display = "flex";
        };

        d.querySelector("#cam_use").onclick = () => {
          if (!capturedBlob) return;
          const fileName = `${slotKey}_cover_${Date.now()}.jpg`;
          const file = new File([capturedBlob], fileName, {
            type: "image/jpeg",
          });
          handleFilePick(slotKey, file);
          toast(`${slotLabel} captured and attached!`);
          stopTracks();
          d.close();
        };

        d.querySelector("#cam_native_fallback").onchange = (e) => {
          const file = e.target.files?.[0];
          if (file) {
            handleFilePick(slotKey, file);
            toast(`${slotLabel} photo attached!`);
            stopTracks();
            d.close();
          }
        };

        d.querySelector("#cam_x").onclick = () => {
          stopTracks();
          d.close();
        };

        d.onclose = () => {
          stopTracks();
          d.remove();
        };
      }
